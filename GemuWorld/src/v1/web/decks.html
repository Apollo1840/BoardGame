<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GemuWorld 卡组管理</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#20242a;background:#edf0f3}*{box-sizing:border-box}body{margin:0}.top{height:60px;background:#17212b;color:#fff;padding:0 20px;display:flex;align-items:center;justify-content:space-between}.top a{color:#fff}.layout{display:grid;grid-template-columns:300px 1fr;height:calc(100vh - 60px)}aside{background:#fff;border-right:1px solid #d9dde1;padding:14px;overflow:auto}.toolbar{display:flex;gap:8px;margin-bottom:10px}.deck-row{padding:10px;border-radius:7px;cursor:pointer;border:1px solid transparent}.deck-row:hover,.deck-row.active{background:#e8f2fb;border-color:#94bddc}.muted{font-size:12px;color:#69737c}main{padding:20px;overflow:auto}.panel{background:#fff;border-radius:12px;padding:18px;max-width:1100px;margin:0 auto 16px;box-shadow:0 2px 8px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}label{display:grid;gap:5px;font-size:13px}input,select,textarea,button{font:inherit;border:1px solid #c7cdd3;border-radius:7px;padding:8px}textarea{min-height:100px;resize:vertical}button{background:#1769aa;color:#fff;border:0;cursor:pointer}button.secondary{background:#5d6973}button.danger{background:#a82727}.wide{grid-column:1/-1}.member-add{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.member-add select{min-width:320px;flex:1}.member{display:grid;grid-template-columns:44px minmax(180px,1fr) 180px 75px auto;gap:8px;align-items:center;padding:8px;border-bottom:1px solid #e5e8ea}.member-actions{display:flex;gap:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{padding:10px;border-radius:7px;margin-bottom:12px}.ok{background:#e4f5e9;color:#176b32}.error{background:#fde7e7;color:#9b1717}.empty{text-align:center;color:#6e7880;padding:80px 20px}@media(max-width:850px){.layout{grid-template-columns:1fr;height:auto}aside{max-height:280px}.member{grid-template-columns:1fr}.member-add select{min-width:100%}}
  </style>
</head>
<body>
  <header class="top"><strong>GemuWorld · 卡组管理</strong><nav><a href="/viewer">Viewer</a> · <a href="/editor">卡牌编辑</a> · <a href="/stats">统计</a></nav></header>
  <div class="layout"><aside><div class="toolbar"><button id="new">新建卡组</button></div><div id="deck-list"></div></aside><main><div id="empty" class="empty">选择一个卡组，或点击“新建卡组”。</div><form id="form" hidden></form></main></div>
  <script>
    const $=id=>document.getElementById(id);let deckList=[],cards=[],current=null;
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function api(url,options){const response=await fetch(url,options);const payload=await response.json();if(!response.ok){const error=new Error(payload.error||response.statusText);error.status=response.status;throw error}return payload}
    async function loadDeckList(){deckList=(await api('/api/decks?language=zh')).items;renderDeckList()}
    function renderDeckList(){$('deck-list').innerHTML=deckList.map(deck=>`<div class="deck-row ${current&&current.id===deck.id?'active':''}" data-id="${deck.id}"><strong>${esc(deck.name)}</strong><div class="muted">${esc(deck.code)} · ${esc(deck.type)} · ${deck.card_count} 张</div></div>`).join('');document.querySelectorAll('.deck-row').forEach(row=>row.onclick=()=>openDeck(+row.dataset.id))}
    async function loadCards(){cards=(await api('/api/cards?language=zh&card_type=all&sort_by=title&direction=asc')).items}
    async function openDeck(id){try{current=await api(`/api/decks/${id}`);renderForm();renderDeckList()}catch(error){alert(error.message)}}
    function emptyDeck(){return{id:null,code:'',deck_type:'default',display_order:deckList.length,version:0,translations:{zh:{name:'',summary:'',description:''},en:{name:'',summary:'',description:''}},members:[],isNew:true}}
    function cardOptions(){return cards.map(card=>`<option value="${card.type}:${card.id}">${card.type==='monster'?'怪':'预'} · ${esc(card.title)} (${esc(card.card_id)})</option>`).join('')}
    function memberHtml(member,index){return `<div class="member" data-type="${member.card_type}" data-id="${member.card_id}"><span>${index+1}</span><strong>${esc(member.title||cards.find(c=>c.type===member.card_type&&c.id===member.card_id)?.title||member.card_id)}</strong><input class="section" placeholder="分段" value="${esc(member.section)}"><input class="quantity" type="number" min="1" value="${member.quantity||1}"><span class="member-actions"><button type="button" class="secondary up">↑</button><button type="button" class="secondary down">↓</button><button type="button" class="danger remove">×</button></span></div>`}
    function renderMembers(){const container=$('members');container.innerHTML=current.members.map(memberHtml).join('');container.querySelectorAll('.member').forEach((row,index)=>{row.querySelector('.remove').onclick=()=>{current.members.splice(index,1);renderMembers()};row.querySelector('.up').onclick=()=>{if(index){[current.members[index-1],current.members[index]]=[current.members[index],current.members[index-1]];renderMembers()}};row.querySelector('.down').onclick=()=>{if(index<current.members.length-1){[current.members[index+1],current.members[index]]=[current.members[index],current.members[index+1]];renderMembers()}}})}
    function renderForm(){
      $('empty').hidden=true;const form=$('form');form.hidden=false;const zh=current.translations.zh||{},en=current.translations.en||{};
      form.innerHTML=`<div id="message"></div><section class="panel"><h2>${current.isNew?'新建':'编辑'}卡组</h2><div class="grid"><label>稳定 code<input name="code" required value="${esc(current.code)}"></label><label>卡组类型<select name="deck_type"><option value="default">普通</option><option value="role">五角色</option><option value="tutorial">教程</option><option value="temporary">临时</option></select></label><label>显示顺序<input name="display_order" type="number" value="${current.display_order}"></label><label>中文名称<input name="zh_name" value="${esc(zh.name)}"></label><label>英文名称<input name="en_name" value="${esc(en.name)}"></label><label class="wide">中文摘要<textarea name="zh_summary">${esc(zh.summary)}</textarea></label><label class="wide">英文摘要<textarea name="en_summary">${esc(en.summary)}</textarea></label><label class="wide">中文介绍 Markdown<textarea name="zh_description">${esc(zh.description)}</textarea></label><label class="wide">英文介绍 Markdown<textarea name="en_description">${esc(en.description)}</textarea></label></div></section><section class="panel"><h2>卡组成员</h2><div class="member-add"><select id="card-select">${cardOptions()}</select><input id="new-section" placeholder="加入分段（可空）"><button type="button" id="add-member">加入</button></div><div id="members"></div></section><section class="panel actions"><button type="submit">保存卡组</button>${current.isNew?'':`<button type="button" class="secondary" id="archive">归档</button><button type="button" class="danger" id="permanent">永久删除</button>`}</section>`;
      form.deck_type.value=current.deck_type;renderMembers();form.onsubmit=save;$('add-member').onclick=()=>{const [type,id]=$('card-select').value.split(':');const numeric=+id;if(current.members.some(m=>m.card_type===type&&m.card_id===numeric)){alert('该卡已经在卡组中');return}const card=cards.find(c=>c.type===type&&c.id===numeric);current.members.push({card_type:type,card_id:numeric,title:card.title,section:$('new-section').value,quantity:1});renderMembers()};if(!current.isNew){$('archive').onclick=()=>remove(false);$('permanent').onclick=()=>remove(true)}
    }
    function collect(){const form=$('form');document.querySelectorAll('.member').forEach((row,index)=>{current.members[index].section=row.querySelector('.section').value;current.members[index].quantity=+row.querySelector('.quantity').value||1});return{version:current.version,code:form.code.value,deck_type:form.deck_type.value,display_order:+form.display_order.value||0,translations:{zh:{name:form.zh_name.value,summary:form.zh_summary.value,description:form.zh_description.value},en:{name:form.en_name.value,summary:form.en_summary.value,description:form.en_description.value}},members:current.members.map(({card_type,card_id,section,quantity})=>({card_type,card_id,section,quantity}))}}
    async function save(event){event.preventDefault();let message=$('message');message.className='status';message.textContent='保存中……';try{const url=current.isNew?'/api/decks':`/api/decks/${current.id}`;current=await api(url,{method:current.isNew?'POST':'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(collect())});await loadDeckList();renderForm();message=$('message');message.className='status ok';message.textContent='卡组保存成功；卡牌编辑器与 Viewer 已同步。'}catch(error){message.className='status error';message.textContent=(error.status===409?'版本冲突，请重新打开卡组：':'保存失败：')+error.message}}
    async function remove(permanent){const action=permanent?'永久删除':'归档';if(!confirm(`确认${action}此卡组？`))return;try{await api(`/api/decks/${current.id}?version=${current.version}&permanent=${permanent}`,{method:'DELETE'});current=null;$('form').hidden=true;$('empty').hidden=false;await loadDeckList()}catch(error){alert(action+'失败：'+error.message)}}
    $('new').onclick=()=>{current=emptyDeck();renderForm();renderDeckList()};Promise.all([loadCards(),loadDeckList()]);
  </script>
</body>
</html>
