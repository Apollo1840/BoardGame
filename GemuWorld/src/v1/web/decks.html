  <header class="top"><strong>GemuWorld · 卡组管理</strong><nav><a href="/viewer">Viewer</a> · <a href="/editor">卡牌编辑</a> · <a href="/stats">统计</a></nav></header>
  <div class="layout"><aside><div class="toolbar"><button id="new">新建卡组</button></div><div class="toolbar"><select id="deck-type-filter"><option value="">全部卡组类型</option></select></div><div class="toolbar"><select id="deck-sort"><option value="display_order:asc">默认顺序</option><option value="valuation:desc">卡组估值从高到低</option><option value="valuation:asc">卡组估值从低到高</option><option value="name:asc">卡组名称正序</option><option value="name:desc">卡组名称倒序</option><option value="card_count:desc">卡牌数量从多到少</option><option value="card_count:asc">卡牌数量从少到多</option><option value="updated_at:desc">最近更新</option><option value="updated_at:asc">最早更新</option></select></div><div class="toolbar"><input id="deck-search" type="search" placeholder="搜索卡组名称或 ID"><button id="deck-query">搜索</button></div><div id="deck-list"></div></aside><main><div id="empty" class="empty">选择一个卡组，或点击“新建卡组”。</div><form id="form" hidden></form></main></div>
  <script src="/effect-editor-shared.js"></script>
  <script>
    const $=id=>document.getElementById(id),effectEditor=window.GemuEffectEditor,STANDARD_PROFESSIONS=effectEditor.fixedProfessions,PROFESSION_MATRIX=[...STANDARD_PROFESSIONS,'其他'],TACTICAL_TAG_ORDER=['输出','输入','转换','追击','反制'],UNASSIGNED_DECK_ID='virtual-unassigned',DECK_TYPE_LABELS={virtual:'自动计算卡组',role:'职业综合卡组',tutorial:'教学卡组',temporary:'临时卡组',attribute:'属性卡组',race:'种族卡组',tribe:'部落卡组',culture:'文化卡组',story:'剧情卡组'};let deckList=[],cards=[],current=null,deckDirty=false,deckEditRevision=0,deckSaveChain=Promise.resolve(),deckHasSaveError=false,deckNeedsRerender=false;
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function api(url,options){const response=await fetch(url,options);const payload=await response.json();if(!response.ok){const error=new Error(payload.error||response.statusText);error.status=response.status;throw error}return payload}
    function isUnassignedCard(card){return!(card.decks||[]).some(deck=>deck.type!=='role')}
    function unassignedDeck(){const members=cards.filter(isUnassignedCard).map(card=>({card_type:card.type,card_id:card.id,title:card.title,section:'',quantity:1}));return{id:UNASSIGNED_DECK_ID,deck_id:UNASSIGNED_DECK_ID,code:'unassigned',type:'virtual',deck_type:'virtual',name:'无归属',card_count:members.length,display_order:-1,updated_at:'',version:0,translations:{zh:{name:'无归属',summary:'',description:''},en:{name:'Unassigned',summary:'',description:''}},members,profession_matrices:[],isVirtual:true}}
    function allDecks(){return[unassignedDeck(),...deckList]}
    async function loadDeckList(){deckList=(await api('/api/decks?language=zh')).items;renderDeckTypeFilter();renderDeckList()}
    function renderDeckTypeFilter(){const select=$('deck-type-filter'),selected=select.value,types=[...new Set(allDecks().map(deck=>deck.type))];select.innerHTML='<option value="">全部卡组类型</option>'+types.map(type=>`<option value="${esc(type)}">${esc(DECK_TYPE_LABELS[type]||type)}</option>`).join('');if(types.includes(selected))select.value=selected}
    function filteredDecks(){const type=$('deck-type-filter').value,keyword=$('deck-search').value.trim().toLocaleLowerCase(),[sortField,direction]=$('deck-sort').value.split(':'),visible=allDecks().filter(deck=>{if(type&&deck.type!==type)return false;if(!keyword)return true;return`${deck.name||''} ${deck.code||''} ${deck.deck_id||''} ${DECK_TYPE_LABELS[deck.type]||deck.type}`.toLocaleLowerCase().includes(keyword)}),fallback=(left,right)=>(Number(left.display_order)||0)-(Number(right.display_order)||0)||(Number(left.id)||0)-(Number(right.id)||0);if(sortField==='display_order')return visible.sort(fallback);return visible.sort((left,right)=>{let leftValue,rightValue;if(sortField==='valuation'){leftValue=deckValuationDetails(left).value;rightValue=deckValuationDetails(right).value}else if(sortField==='name'){leftValue=String(left.name||'');rightValue=String(right.name||'')}else if(sortField==='updated_at'){leftValue=String(left.updated_at||'');rightValue=String(right.updated_at||'')}else{leftValue=Number(left.card_count)||0;rightValue=Number(right.card_count)||0}if(sortField==='valuation'){if(leftValue==null&&rightValue==null)return fallback(left,right);if(leftValue==null)return 1;if(rightValue==null)return-1}const compared=typeof leftValue==='string'?leftValue.localeCompare(rightValue,'zh-CN'):leftValue-rightValue;return compared?(direction==='desc'?-compared:compared):fallback(left,right)})}
    function effectEstimateValues(effects){const valued=effects.map(effect=>({...effect,numericValuation:effect.valuation==null||effect.valuation===''?null:Number(effect.valuation)})).filter(effect=>Number.isFinite(effect.numericValuation)),attributeValuation=valued.filter(effect=>effect.type==='monster_attribute'||effect.type==='monster_reactive_attribute').reduce((sum,effect)=>sum+effect.numericValuation,0),skillValues=valued.filter(effect=>effect.type==='monster_skill').map(effect=>effect.numericValuation-(Number(effect.energy_cost)||0)),skillValuation=Math.max(...skillValues,0);return{skillValuation,effectiveMagic:attributeValuation+skillValuation}}
    function prophecyValuation(effects,permanent=false){const values=type=>effects.filter(effect=>effect.type===type&&effect.valuation!=null&&effect.valuation!==''&&Number.isFinite(Number(effect.valuation))).map(effect=>Number(effect.valuation)),normal=values('prophecy_effect'),reactive=values('prophecy_reactive_effect'),all=[...normal,...reactive],deduction=permanent?1:2;if(!all.length)return null;const sum=all.reduce((total,value)=>total+value,0),highest=Math.max(...all);return normal.length&&reactive.length?((permanent?sum:highest)-deduction)*1.2:highest-deduction}
    function isPermanentProphecyCard(card){const match=String(card.introduction||'').trim().match(/^【([^】]+)】/);return Boolean(match&&match[1].split('/').includes('永续'))}
    function cardValuation(card){if(card.type==='monster')return effectEstimateValues(card.effects||[]).effectiveMagic-(Number(card.magic)||0);return prophecyValuation(card.effects||[],isPermanentProphecyCard(card))}
    function deckValuationDetails(deck){let total=0,valuedCount=0,missingCount=0;cards.forEach(card=>{const membership=deck.isVirtual?(isUnassignedCard(card)?{quantity:1}:null):(card.decks||[]).find(value=>value.deck_id===deck.deck_id);if(!membership)return;const quantity=Math.max(1,Math.floor(Number(membership.quantity)||1)),valuation=cardValuation(card);if(valuation==null||!Number.isFinite(valuation)){missingCount+=quantity;return}total+=valuation*quantity;valuedCount+=quantity});const totalCount=valuedCount+missingCount;return{value:totalCount?total/totalCount:null,valuedCount,missingCount,totalCount}}
    function renderDeckList(){const visible=filteredDecks();$('deck-list').innerHTML=visible.length?visible.map(deck=>{const valuation=deckValuationDetails(deck),label=valuation.value==null?'—':valuation.value.toFixed(2),title=`卡组估值 = 卡牌估值之和 ÷ 卡牌总数；缺少估值按 0 计算；共 ${valuation.totalCount} 张，其中 ${valuation.missingCount} 张缺少估值`;return`<div class="deck-row ${current&&current.id===deck.id?'active':''}" data-id="${esc(deck.id)}"><div class="deck-title-line"><span class="deck-valuation-pill" title="${esc(title)}">${esc(label)}</span><strong>${esc(deck.name)}</strong></div><div class="muted">${esc(DECK_TYPE_LABELS[deck.type]||deck.type)} · ${deck.card_count} 张</div></div>`}).join(''):'<div class="empty" style="padding:32px 8px">没有匹配的卡组</div>';document.querySelectorAll('.deck-row').forEach(row=>row.onclick=()=>openDeck(row.dataset.id))}
    async function loadCards(refreshCurrent=false){cards=(await api('/api/cards?language=zh&card_type=all&sort_by=title&direction=asc')).items;if(deckList.length)renderDeckList();if(refreshCurrent&&current&&!deckDirty&&$('members')){if(current.isVirtual){current=unassignedDeck();renderForm();renderDeckList();return}current.members.forEach(member=>{const card=cards.find(value=>value.type===member.card_type&&value.id===member.card_id);if(card)member.title=card.title});renderMemberCardOptions();renderMembers()}}
    async function ensureCardProfessionDetails(member){const card=cards.find(value=>value.type===member.card_type&&value.id===member.card_id);if(!card||(card.effects||[]).every(effect=>Object.prototype.hasOwnProperty.call(effect,'professions')&&Object.prototype.hasOwnProperty.call(effect,'tactical_tags')))return card;const detail=await api(`/api/cards/${member.card_type}/${member.card_id}`);card.effects=detail.effects||[];return card}
    async function openDeck(id){try{if(current&&!(await flushDeckSave())&&!current.isNew)return;current=String(id)===UNASSIGNED_DECK_ID?unassignedDeck():await api(`/api/decks/${id}`);await Promise.all(current.members.map(ensureCardProfessionDetails));resetDeckSaveState();renderForm();renderDeckList()}catch(error){alert(error.message)}}
    function emptyDeck(){return{id:null,deck_id:'',code:'',deck_type:'tribe',display_order:deckList.length,version:0,translations:{zh:{name:'',summary:'',description:''},en:{name:'',summary:'',description:''}},members:[],profession_matrices:[],isNew:true}}
    function memberCardMatches(card,keyword){const term=keyword.trim().toLocaleLowerCase();return!term||`${card.title||''} ${card.card_id||''} ${card.type==='monster'?'怪物 monster':'预言 prophecy'}`.toLocaleLowerCase().includes(term)}
    function cardOptions(keyword=''){const matching=cards.filter(card=>memberCardMatches(card,keyword));return matching.length?matching.map(card=>`<option value="${card.type}:${card.id}">${card.type==='monster'?'怪':'预'} · ${esc(card.title)} (${esc(card.card_id)})</option>`).join(''):'<option value="">没有匹配卡牌</option>'}
    function renderMemberCardOptions(){const select=$('card-select'),selected=select.value;select.innerHTML=cardOptions($('member-search').value);if(Array.from(select.options).some(option=>option.value===selected))select.value=selected}
    function monsterLevel(card){return Math.max(0,Math.floor(Number(card?.level)||0))}
    function monsterStars(level){return '★'.repeat(Math.max(0,Math.floor(Number(level)||0)))}
    function memberHtml(member,index){
      const card=cards.find(value=>value.type===member.card_type&&value.id===member.card_id),valuation=card?cardValuation(card):null,missing=valuation==null||!Number.isFinite(valuation),valuationLabel=missing?'--':valuation.toFixed(1),valuationClass=missing?'missing':valuation>0?'positive':valuation<0?'negative':'',level=member.card_type==='monster'?monsterLevel(card):null,stars=level==null?'':monsterStars(level);
      const controls=current.isVirtual?'<span class="muted">实时计算</span><span class="muted">×1</span><span></span>':`<input class="section" placeholder="分段" value="${esc(member.section)}"><input class="quantity" type="number" min="1" value="${member.quantity||1}"><span class="member-actions"><button type="button" class="secondary up">↑</button><button type="button" class="secondary down">↓</button><button type="button" class="danger remove">×</button></span>`;
      return `<div class="member" data-type="${member.card_type}" data-id="${member.card_id}"><span>${index+1}</span><span class="member-valuation ${valuationClass}" title="卡牌估值">${valuationLabel}</span><a class="member-title ${member.card_type==='prophecy'?'member-title-prophecy':''}" href="/editor?type=${encodeURIComponent(member.card_type)}&id=${encodeURIComponent(member.card_id)}" target="_blank" rel="noopener">${esc(card?.title||member.title||member.card_id)}${level==null?'':`<span class="member-level-stars" title="Lv${level}" aria-label="等级 ${level}">${stars}</span>`}</a>${controls}</div>`
    }
    function matrixProfessions(values){if(!values.length)return['其他'];const mapped=values.map(value=>STANDARD_PROFESSIONS.includes(value)?value:'其他');return[...new Set(mapped)]}
    function matrixProfessionCells(groups){const primary=matrixProfessions(groups.primary),secondary=matrixProfessions(groups.secondary);if(!groups.primary.length&&!groups.secondary.length)return[['其他','其他']];if(!groups.primary.length)return secondary.map(profession=>[profession,profession]);if(!groups.secondary.length)return primary.map(profession=>[profession,profession]);return primary.flatMap(primaryProfession=>secondary.map(secondaryProfession=>[primaryProfession,secondaryProfession]))}
    function storedReferenceMatrixKeys(){return new Set((current.profession_matrices||[]).filter(value=>value.value).map(value=>`${value.card_type}:${value.primary_profession}:${value.secondary_profession}`))}
    function referenceMatrixKeys(){const inputs=document.querySelectorAll('.reference-profession');return inputs.length?new Set(Array.from(inputs).filter(input=>input.checked).map(input=>`${input.dataset.cardType}:${input.dataset.primary}:${input.dataset.secondary}`)):storedReferenceMatrixKeys()}
    function referenceMatrixHtml(cardType){const selected=storedReferenceMatrixKeys(),head=STANDARD_PROFESSIONS.map(profession=>`<th scope="col">${profession}</th>`).join(''),rows=STANDARD_PROFESSIONS.map(primary=>`<tr><th scope="row">${primary}</th>${STANDARD_PROFESSIONS.map(secondary=>{const checked=selected.has(`${cardType}:${primary}:${secondary}`);return`<td><label class="reference-toggle" title="${primary} / ${secondary}"><input class="reference-profession" type="checkbox" data-card-type="${cardType}" data-primary="${primary}" data-secondary="${secondary}" ${checked?'checked':''}><span>${checked?'1':'0'}</span></label></td>`}).join('')}</tr>`).join('');return`<table class="profession-matrix reference-matrix"><thead><tr><th></th>${head}</tr></thead><tbody>${rows}</tbody></table>`}
    function isRegularTournament(matrix){const target=(matrix.length-1)/2;return matrix.every(row=>row.reduce((sum,value)=>sum+value,0)===target)}
    function randomRegularTournament5Bruteforce(){const n=STANDARD_PROFESSIONS.length;while(true){const matrix=Array.from({length:n},()=>Array(n).fill(0));for(let i=0;i<n;i++)for(let j=i+1;j<n;j++){if(Math.random()<.5)matrix[i][j]=1;else matrix[j][i]=1}if(isRegularTournament(matrix))return matrix}}
    function generateReferenceMatrix(cardType){const matrix=randomRegularTournament5Bruteforce(),retained=Array.from(document.querySelectorAll('.reference-profession:checked')).filter(input=>input.dataset.cardType!==cardType).map(input=>({card_type:input.dataset.cardType,primary_profession:input.dataset.primary,secondary_profession:input.dataset.secondary,value:1})),generated=matrix.flatMap((row,i)=>row.flatMap((value,j)=>value?[{card_type:cardType,primary_profession:STANDARD_PROFESSIONS[i],secondary_profession:STANDARD_PROFESSIONS[j],value:1}]:[]));current.profession_matrices=[...retained,...generated];renderReferenceMatrices();renderProfessionMatrix();markDeckDirty();requestDeckSave()}
    function renderDeckTypeOptions(){const select=document.querySelector('[name="deck_type"]');if(!select)return;select.innerHTML=Object.entries(DECK_TYPE_LABELS).map(([value,label])=>`<option value="${value}">${label}</option>`).join('');select.value=current.deck_type}
    function renderReferenceMatrices(){renderDeckTypeOptions();const monster=$('reference-matrix-monster'),prophecy=$('reference-matrix-prophecy');if(monster)monster.innerHTML=referenceMatrixHtml('monster');if(prophecy)prophecy.innerHTML=referenceMatrixHtml('prophecy');const monsterButton=$('generate-reference-monster'),prophecyButton=$('generate-reference-prophecy');if(monsterButton)monsterButton.onclick=()=>generateReferenceMatrix('monster');if(prophecyButton)prophecyButton.onclick=()=>generateReferenceMatrix('prophecy')}

    function tacticalTagCounts(cardType=''){const counts=new Map();current.members.filter(member=>!cardType||member.card_type===cardType).forEach(member=>{const card=cards.find(value=>value.type===member.card_type&&value.id===member.card_id);if(!card)return;const quantity=Math.max(1,Math.floor(Number(member.quantity)||1)),cardTags=new Set((card.effects||[]).flatMap(effect=>effect.tactical_tags||[]));cardTags.forEach(tag=>{const entry=counts.get(tag)||{count:0,cards:[]};entry.count+=quantity;entry.cards.push({type:card.type,title:card.title,card_id:card.card_id,quantity});counts.set(tag,entry)})});return[...counts.entries()].sort((left,right)=>{const leftIndex=TACTICAL_TAG_ORDER.indexOf(left[0]),rightIndex=TACTICAL_TAG_ORDER.indexOf(right[0]),leftPreset=leftIndex!==-1,rightPreset=rightIndex!==-1;if(leftPreset&&rightPreset)return leftIndex-rightIndex;if(leftPreset)return-1;if(rightPreset)return 1;return left[0].localeCompare(right[0],'zh-CN')})}
    function tacticalTagChartHtml(cardType=''){const entries=tacticalTagCounts(cardType);if(!entries.length)return'<div class="tactical-empty">当前分组没有已设置的战术标签</div>';const max=Math.max(...entries.map(([,entry])=>entry.count)),description=entries.map(([tag,entry])=>`${tag} ${entry.count}`).join('，'),showCards=Boolean(cardType);return`<div class="tactical-tag-chart" role="img" aria-label="战术标签总计：${esc(description)}">${entries.map(([tag,entry])=>`<div class="tactical-bar-row" title="${esc(tag)}：${entry.count}"><span class="tactical-bar-label">${esc(tag)}</span><span class="tactical-bar-track"><span class="tactical-bar" style="width:${Math.round(entry.count/max*100)}%"></span></span><strong class="tactical-bar-value">${entry.count}</strong>${showCards?`<span class="tactical-card-list">${entry.cards.map(card=>`<span class="tactical-card" title="${esc(card.card_id)}">${esc(card.title)}${card.quantity>1?` ×${card.quantity}`:''}</span>`).join('')}</span>`:''}</div>`).join('')}</div>`}

    function renderForm(){
