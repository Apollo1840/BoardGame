:root{font-family:system-ui,sans-serif;color:#20242a;background:#edf0f3}*{box-sizing:border-box}body{margin:0}.top{height:60px;background:#17212b;color:#fff;padding:0 20px;display:flex;align-items:center;justify-content:space-between}.top a{color:#fff}.layout{display:grid;grid-template-columns:430px 1fr;height:calc(100vh - 60px)}aside{background:#fff;padding:14px;border-right:1px solid #ddd;overflow:auto}.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}input,select,textarea,button{font:inherit;border:1px solid #c7cdd3;border-radius:7px;padding:8px}button{background:#1769aa;color:#fff;border:0;cursor:pointer}.profession-summary{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:8px 0 10px;border-bottom:1px solid #e5e7eb}.profession-summary-label{font-size:12px;color:#69737c;margin-right:2px}.profession-filter-pill{cursor:pointer;border:2px solid transparent;user-select:none}.profession-filter-pill:hover{filter:brightness(.94)}.profession-filter-pill.active{border-color:#17212b;box-shadow:0 0 0 1px #fff inset}.effect-row{padding:9px;border-bottom:1px solid #eee;cursor:pointer}.effect-row:hover,.effect-row.active{background:#e8f2fb}.muted{font-size:12px;color:#69737c}.profession-pill{display:inline-block;padding:2px 7px;border-radius:999px;font-size:11px;font-weight:700;line-height:1.4;vertical-align:1px;background:#d1d5db;color:#374151}.tactical-tag-pill{background:#e2e8f0;color:#475569;border:1px solid #cbd5e1}.profession-assassin{background:#fecaca;color:#991b1b}.profession-tank{background:#bfdbfe;color:#1e40af}.profession-marksman{background:#fed7aa;color:#9a3412}.profession-mage{background:#e9d5ff;color:#6b21a8}.profession-support{background:#bbf7d0;color:#166534}.dup{color:#a45b00;font-size:12px}main{padding:20px;overflow:auto}.panel{background:#fff;border-radius:12px;padding:18px;max-width:900px;margin:auto;box-shadow:0 2px 8px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:5px}.wi </style></head><body><header class="top"><strong>GemuWorld · 卡效编辑</strong><nav><a href="/viewer">Viewer</a> · <a href="/editor">卡牌编辑</a> · <a href="/design-guides">设计指南</a></nav></header><div class="layout"><aside><div class="filters"><select id="card-type"><option value="">全部卡型</option><option value="monster">怪物</option><option value="prophecy">预言</option></select><select id="effect-type"><option value="">全部效果</option><option value="monster_skill">怪物技能</option><option value="monster_attribute">通常属性</option><option value="monster_reactive_attribute">反应属性</option><option value="normal_prophecy_effect">预言效果</option><option value="permanent_prophecy_effect">（永续）预言效果</option><option value="prophecy_reactive_effect">预言响应</option></select><select id="sort"><option value="id:asc">ID 从小到大</option><option value="id:desc">ID 从大到小</option><option value="text:asc">中文效果字典序</option><option value="text_length:asc" selected>中文效果字数从少到多</option><option value="text_length:desc">中文效果字数从多到少</option><option value="owner:asc">卡名排序</option><option value="type:asc">效果类型排序</option><option value="profession:asc">职业排序</option><option value="valuation:desc">估值从高到低</option><option value="valuation:asc">估值从低到高</option></select><input id="keyword" class="wide" placeholder="搜索效果 ID、卡名或效果文字"><button id="search">查询</button></div><div id="profession-summary" class="profession-summary"></div><div id="list"></div></aside><main><div id="empty" class="empty">选择一条效果。</div><form id="form" class="panel" hidden></form></main></div><script src="/effect-editor-shared.js"></script><script>
const $=id=>document.getElementById(id),effectEditor=window.GemuEffectEditor,FIXED_PROFESSIONS=effectEditor.fixedProfessions,TACTICAL_TAG_PRESETS=['输入','输出','追击','反制'];let effects=[],current=null,cards=[],professions=[...FIXED_PROFESSIONS],professionCounts={},selectedProfessions=new Set(),navigating=false,effectDirty=false,effectEditRevision=0,effectUndo=null,effectSaveChain=Promise.resolve(),effectHasSaveError=false;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const effectLabels=effectEditor.effectLabels,professionClasses=effectEditor.professionClasses;const detailTitle=e=>e.type==='prophecy_effect'&&e.owner?.is_permanent?'（永续）预言效果':effectEditor.detailTitle(e.type,e.translations.zh?.name);async function api(url,options){const r=await fetch(url,options),p=await r.json();if(!r.ok){const e=new Error(p.error||r.statusText);e.status=r.status;throw e}return p}
let editingProfessions=[],editingTacticalTags=[];
const listHeader=document.createElement('div');listHeader.style.cssText='display:flex;align-items:center;justify-content:space-between;min-height:26px;margin-bottom:8px';listHeader.innerHTML='<strong>卡效列表</strong><span id="list-actions" style="display:flex;align-items:center;gap:10px"></span>';$('card-type').closest('.filters').before(listHeader);
function fieldLabel(label,onCard){return onCard?`<strong>${label}</strong>`:label}
function renderProfessionSummary(){const summary=[...professions,'__unset__'];$('profession-summary').innerHTML=`<span class="profession-summary-label">职业词条：</span>${summary.map(profession=>`<span class="profession-pill profession-filter-pill ${professionClasses[profession]||''} ${selectedProfessions.has(profession)?'active':''}" data-profession="${esc(profession)}">${esc(profession==='__unset__'?'未设置':profession)} ${professionCounts[profession]||0}</span>`).join('')}`;document.querySelectorAll('.profession-filter-pill').forEach(pill=>pill.onclick=()=>toggleProfession(pill.dataset.profession))}
function toggleProfession(profession){selectedProfessions.has(profession)?selectedProfessions.delete(profession):selectedProfessions.add(profession);renderProfessionSummary();load()}
async function loadProfessions(){const payload=await api('/api/effect-professions'),stored=payload.items;professionCounts=payload.counts||{};professions=[...FIXED_PROFESSIONS,...stored.filter(profession=>!FIXED_PROFESSIONS.includes(profession))];const allowed=new Set([...professions,'__unset__']);selectedProfessions=new Set([...selectedProfessions].filter(profession=>allowed.has(profession)));renderProfessionSummary()}
async function load(){const q=new URLSearchParams(),[sort_by,direction]=$('sort').value.split(':');if($('card-type').value)q.set('card_type',$('card-type').value);if($('effect-type').value)q.set('effect_type',$('effect-type').value);selectedProfessions.forEach(profession=>q.append('profession',profession));if($('keyword').value)q.set('keyword',$('keyword').value);q.set('sort_by',sort_by);q.set('direction',direction);effects=(await api('/api/effects?'+q)).items;renderList()}
function formatValuation(value){const rounded=Math.round(Number(value)*10)/10;return Number.isInteger(rounded)?String(rounded):rounded.toFixed(1)}
const effectTitleColors={monster_skill:'#111827',monster_attribute:'#2563eb',monster_reactive_attribute:'#dc2626',prophecy_effect:'#1e3a8a',prophecy_reactive_effect:'#7f1d1d'};
function renderList(){$('list').innerHTML=effects.map(e=>`<div class="effect-row ${current&&current.id===e.id?'active':''}" data-id="${e.id}">${!e.owner?'<span title="未绑定卡牌" aria-label="未绑定卡牌" style="float:right;width:9px;height:9px;margin:2px 1px 0 8px;border-radius:50%;background:#dc2626;box-shadow:0 0 0 2px #fee2e2"></span>':''}${e.valuation!=null?`<span class="profession-pill" style="background:linear-gradient(135deg,#fff8b8 0%,#ffd84d 42%,#f4b400 100%);color:#5b3b00;border:1px solid #d99a00;box-shadow:inset 0 1px 0 #fff9cf,0 1px 1px #8a5a0026">${esc(formatValuation(e.valuation))}</span> `:''}${(e.professions||[]).map(profession=>`<span class="profession-pill ${professionClasses[profession]||''}">${esc(profession)}</span> `).join('')}${(e.tactical_tags||[]).map(tag=>`<span class="profession-pill tactical-tag-pill">${esc(tag)}</span> `).join('')}<strong style="color:${effectTitleColors[e.type]||'#111827'}">${esc(detailTitle(e))}</strong>${e.marker?` <span class="muted">${esc(e.marker)}</span>`:''}<div>${esc(e.translations.zh?.text||'')}</div>${e.duplicate_ids.length?`<div class="dup">相同文本效果 ID：${e.duplicate_ids.map(id=>'#'+id).join('、')}</div>`:''}</div>`).join('');document.querySelectorAll('.effect-row').forEach(r=>r.onclick=()=>openEffect(+r.dataset.id));$('list').querySelector('.effect-row.active')?.scrollIntoView({block:'nearest'})}
async function openEffect(id){if(current&&!(await flushEffectSave()))return;current=await api('/api/effects/'+id);if(!current.owner)current.owner={card_type:'',id:0,card_id:'未绑定',title:'尚未链接卡牌'};effectDirty=false;effectUndo=null;effectHasSaveError=false;renderForm();renderList()}
async function createLibraryEffect(){if(current&&!(await flushEffectSave()))return;const selectedType=$('effect-type').value,type=['normal_prophecy_effect','permanent_prophecy_effect'].includes(selectedType)?'prophecy_effect':selectedType;current={id:null,type,position:0,energy_cost:0,professions:[],tactical_tags:[],valuation:null,marker:'',notes:'',version:0,owner:null,translations:{zh:{name:'',text:''}},duplicate_ids:[],isNew:true};effectDirty=false;effectUndo=null;effectHasSaveError=false;renderForm();renderList()}
function targetCards(keyword=''){const term=keyword.trim().toLocaleLowerCase();return cards.filter(c=>c.type===current.owner.card_type&&c.id!==current.owner.id&&(!term||`${c.title} ${c.card_id}`.toLocaleLowerCase().includes(term)))}
function renderTargets(keyword=''){const select=$('target'),selected=select.value,matching=targetCards(keyword);select.innerHTML=`<option value="">${matching.length?`复制到卡牌……（${matching.length}）`:'没有匹配卡牌'}</option>${matching.map(c=>`<option value="${c.type}:${c.id}">${esc(c.title)} · ${esc(c.card_id)}</option>`).join('')}`;if(Array.from(select.options).some(option=>option.value===selected))select.value=selected}
function renderEditingProfessions(){const box=$('editing-professions');box.innerHTML=editingProfessions.map((profession,index)=>`<button type="button" class="profession-tag ${professionClasses[profession]||''}" data-index="${index}" title="删除职业">${esc(profession)} ×</button>`).join('');box.querySelectorAll('button').forEach(button=>{button.onmousedown=event=>event.preventDefault();button.onclick=()=>{editingProfessions.splice(+button.dataset.index,1);renderEditingProfessions();markEffectDirty();requestEffectSave()}})}
function addEditingProfessions(text){let changed=false;for(const value of String(text||'').split(/[,，]/).map(value=>value.trim()).filter(Boolean)){if(!editingProfessions.includes(value)){editingProfessions.push(value);changed=true}}renderEditingProfessions();return changed}
function renderEditingTacticalTags(){const box=$('editing-tactical-tags');box.innerHTML=editingTacticalTags.map((tag,index)=>`<button type="button" class="profession-tag tactical-tag" data-index="${index}" title="删除战术标签">${esc(tag)} ×</button>`).join('');box.querySelectorAll('button').forEach(button=>{button.onmousedown=event=>event.preventDefault();button.onclick=()=>{editingTacticalTags.splice(+button.dataset.index,1);renderEditingTacticalTags();markEffectDirty();requestEffectSave()}})}
function addEditingTacticalTags(text){let changed=false;for(const value of String(text||'').split(/[,，]/).map(value=>value.trim()).filter(Boolean)){if(!editingTacticalTags.includes(value)){editingTacticalTags.push(value);changed=true}}renderEditingTacticalTags();return changed}
function renderForm(){const zh=current.translations.zh||{},en=current.translations.en||{},skill=effectEditor.supportsEnergy(current.type);editingProfessions=[...(current.professions||[])];editingTacticalTags=[...(current.tactical_tags||[])];$('empty').hidden=true;const f=$('form');f.hidden=false;f.innerHTML=`<div id="message"></div><h2>${esc(detailTitle(current))}</h2><p class="muted">所属卡牌：${esc(current.owner.title)} · ${esc(current.owner.card_id)} · effect #${current.id}</p><div class="grid"><label class="wide">效果类型<input value="${esc(effectLabels[current.type]||current.type)}" disabled></label><div class="wide" style="display:flex;gap:12px">${skill?`<label style="width:140px">${fieldLabel('灵力消耗',true)}<input name="energy" type="number" step="0.5" style="width:100%" value="${current.energy_cost??0}"></label>`:''}<label style="width:140px">估值<input name="valuation" type="number" step="any" style="width:100%" value="${esc(current.valuation??'')}"></label></div>${skill?`<label>${fieldLabel('中文名称',true)}<input name="zh_name" value="${esc(zh.name)}"></label><label>${fieldLabel('英文名称',true)}<input name="en_name" value="${esc(en.name)}"></label>`:''}<label>${fieldLabel('中文效果',true)}<textarea name="zh_text">${esc(zh.text)}</textarea></label><label>${fieldLabel('英文效果',true)}<textarea name="en_text">${esc(en.text)}</textarea></label><div class="wide" style="border-top:1px solid #d9dee3;margin:6px 0 2px"></div><label class="wide">职业标签<span id="editing-professions" class="profession-tags"></span><input name="profession_input" placeholder="输入新职业，按回车或逗号添加"><span class="profession-tags">${professions.map(profession=>`<button type="button" class="profession-tag ${professionClasses[profession]||''}" data-profession="${esc(profession)}">${esc(profession)}</button>`).join('')}</span></label><label class="wide">战术标签<span id="editing-tactical-tags" class="profession-tags"></span><input name="tactical_tag_input" placeholder="输入新战术标签，按回车或逗号添加"><span class="profession-tags">${TACTICAL_TAG_PRESETS.map(tag=>`<button type="button" class="profession-tag tactical-tag" data-tactical-tag="${esc(tag)}">${esc(tag)}</button>`).join('')}</span></label><label>标记（最多10字）<input name="marker" maxlength="10" value="${esc(current.marker||'')}"></label><span></span><label class="wide">备注<textarea name="notes">${esc(current.notes||'')}</textarea></label></div><div class="actions"><button type="button" id="undo-effect">撤销上次更改</button><input id="target-search" type="search" placeholder="搜索目标卡名或 card_id"><select id="target"></select><button type="button" id="copy">复制</button>${current.duplicate_ids.map(id=>`<button type="button" class="same-text" data-id="${id}">转到同文效果 #${id}</button>`).join('')}</div>`;f.onsubmit=event=>event.preventDefault();renderEditingProfessions();renderEditingTacticalTags();renderTargets();updateEffectUndoButton();$('undo-effect').onclick=undoEffect;f.profession_input.onkeydown=event=>{if(event.key==='Enter'||event.key===','||event.key==='，'){event.preventDefault();if(addEditingProfessions(event.target.value)){event.target.value='';markEffectDirty();requestEffectSave()}}};f.tactical_tag_input.onkeydown=event=>{if(event.key==='Enter'||event.key===','||event.key==='，'){event.preventDefault();if(addEditingTacticalTags(event.target.value)){event.target.value='';markEffectDirty();requestEffectSave()}}};$('target-search').oninput=event=>renderTargets(event.target.value);$('target-search').onkeydown=event=>{if(event.key==='Enter')event.preventDefault()};$('copy').onclick=copy;f.querySelectorAll('[data-profession]').forEach(button=>{button.onmousedown=event=>event.preventDefault();button.onclick=()=>{if(addEditingProfessions(button.dataset.profession)){markEffectDirty();requestEffectSave()}}});f.querySelectorAll('[data-tactical-tag]').forEach(button=>{button.onmousedown=event=>event.preventDefault();button.onclick=()=>{if(addEditingTacticalTags(button.dataset.tacticalTag)){markEffectDirty();requestEffectSave()}}});f.querySelectorAll('.same-text').forEach(button=>button.onclick=()=>openEffect(+button.dataset.id));f.querySelector('.grid').addEventListener('input',()=>markEffectDirty());f.querySelector('.grid').addEventListener('focusout',event=>{if(event.target.matches('input,textarea,select'))requestEffectSave()});f.querySelector('.grid').addEventListener('change',()=>{markEffectDirty();requestEffectSave()})}
const cloneEffect=value=>JSON.parse(JSON.stringify(value));
function effectPayload(effect){return{version:effect.version,type:effect.type,energy_cost:effect.energy_cost,professions:cloneEffect(effect.professions||[]),tactical_tags:cloneEffect(effect.tactical_tags||[]),valuation:effect.valuation,marker:effect.marker||'',notes:effect.notes||'',translations:cloneEffect(effect.translations||{zh:{name:'',text:''}})}}
function collectEffectForm(){const f=$('form'),type=f.effect_type?.value||current.type,supportsEnergy=effectEditor.supportsEnergy(type),supportsName=effectEditor.supportsName(type);addEditingProfessions(f.profession_input.value);f.profession_input.value='';addEditingTacticalTags(f.tactical_tag_input.value);f.tactical_tag_input.value='';return{version:current.version,type,energy_cost:supportsEnergy?(+f.energy?.value||0):null,professions:[...editingProfessions],tactical_tags:[...editingTacticalTags],valuation:f.valuation.value===''?null:+f.valuation.value,marker:f.marker.value,notes:f.notes.value,translations:{zh:{name:supportsName?(f.zh_name?.value||''):'',text:f.zh_text.value},en:{name:supportsName?(f.en_name?.value||''):'',text:f.en_text.value}}}}
function markEffectDirty(){if(!current)return;effectDirty=true;effectEditRevision++}
function updateEffectUndoButton(){const button=$('undo-effect');if(!button)return;button.disabled=!effectUndo;button.style.opacity=effectUndo?'1':'.65';button.style.background=effectUndo?'#5d6873':'#c7cdd3';button.style.cursor=effectUndo?'pointer':'not-allowed'}
async function persistCurrent(rerender=false){if(!current||(!effectDirty&&!current.isNew))return true;const payload=collectEffectForm(),type=payload.type,m=$('message');if(!type){m.className='status';m.textContent='选择效果类型后将自动保存。';return false}const revision=effectEditRevision,effect=current,isNew=Boolean(effect.isNew),previous=isNew?null:effectPayload(effect);if(!effectHasSaveError){m.className='status';m.textContent='自动保存中……'}try{const saved=await api(isNew?'/api/effects':'/api/effects/'+effect.id,{method:isNew?'POST':'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});current=saved;effectDirty=effectEditRevision!==revision;effectUndo=previous;effectHasSaveError=false;await Promise.all([loadProfessions(),isNew?load():Promise.resolve()]);syncCurrentListItem(current);if((isNew||rerender)&&!effectDirty)renderForm();else{updateEffectUndoButton();const status=$('message');status.className='status ok';status.textContent=effectDirty?'已保存上一项更改，正在等待保存新输入。':'已自动保存。'}return true}catch(e){effectHasSaveError=true;m.className='status error';m.textContent=(e.status===409?'版本冲突：':'自动保存失败：')+e.message;return false}}
function requestEffectSave(rerender=false){effectSaveChain=effectSaveChain.then(()=>persistCurrent(rerender),()=>persistCurrent(rerender));return effectSaveChain}
async function flushEffectSave(){let saved=await effectSaveChain;while(saved!==false&&effectDirty)saved=await requestEffectSave();return !effectDirty}
async function undoEffect(){if(!effectUndo||!current?.id)return;await flushEffectSave();if(!effectUndo)return;const payload=cloneEffect(effectUndo);payload.version=current.version;const m=$('message');m.className='status';m.textContent='正在撤销……';try{current=await api('/api/effects/'+current.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});effectUndo=null;effectDirty=false;await loadProfessions();syncCurrentListItem(current);renderForm();const status=$('message');status.className='status ok';status.textContent='已撤销最近一次自动保存。'}catch(e){m.className='status error';m.textContent='撤销失败：'+e.message}}
async function navigateEffect(step){if(navigating||!effects.length)return;const index=current?effects.findIndex(effect=>effect.id===current.id):-1,targetIndex=index<0?(step>0?0:effects.length-1):index+step;if(targetIndex<0||targetIndex>=effects.length)return;navigating=true;try{await openEffect(effects[targetIndex].id)}finally{navigating=false}}
async function copy(){if(!(await flushEffectSave()))return;const value=$('target').value;if(!value){alert('请选择目标卡牌');return}const [target_type,target_id]=value.split(':');try{const copied=await api(`/api/effects/${current.id}/copy`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target_type,target_id:+target_id})});alert(`已复制为效果 #${copied.id}`);await load()}catch(e){alert('复制失败：'+e.message)}}
function syncCurrentListItem(effect){if(!effect?.id)return;const index=effects.findIndex(value=>value.id===effect.id);if(index<0)return;effects[index]={...effect,owner:effect.owner?.card_type?effect.owner:null,professions:[...(effect.professions||[])],translations:{...(effect.translations||{})}};renderList()}
function previewCurrentListItem(event){if(!current?.id||event?.target?.name==='profession_input')return;const index=effects.findIndex(value=>value.id===current.id);if(index<0)return;const f=$('form'),existing=effects[index],zh=existing.translations?.zh||{};effects[index]={...existing,professions:[...editingProfessions],valuation:f.valuation.value===''?null:+f.valuation.value,marker:f.marker.value,translations:{...(existing.translations||{}),zh:{...zh,name:f.zh_name?.value||'',text:f.zh_text.value}}};renderList()}
function currentListFilters(){const [sort_by,direction]=$('sort').value.split(':');return{card_type:$('card-type').value,effect_type:$('effect-type').value,professions:[...selectedProfessions],keyword:$('keyword').value,sort_by,direction}}
async function exportCurrentEffects(){if(current&&!(await flushEffectSave()))return;if(!effects.length){alert('当前列表没有可导出的卡效');return}try{const result=await api('/api/effects/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({effect_ids:effects.map(effect=>effect.id),filters:currentListFilters()})});alert(`已导出 ${result.count} 条卡效到：\n${result.path}`)}catch(e){alert('导出卡效失败：'+e.message)}}

async function exportPureEffects(){if(current&&!(await flushEffectSave()))return;if(!effects.length){alert('当前列表没有可导出的卡效');return}try{const result=await api('/api/effects/pure-export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({effect_ids:effects.map(effect=>effect.id),filters:currentListFilters()})});alert(`已纯效导出 ${result.count} 条卡效到：\n${result.path}\n\n文件仅包含卡效 ID、中文效果描述和估值。`)}catch(e){alert('纯效导出失败：'+e.message)}}
async function importPureEffectFile(event){const file=event.target.files?.[0];event.target.value='';if(!file||current&&!(await flushEffectSave()))return;try{const backup=JSON.parse(await file.text()),count=backup.count??backup.items?.length??0;if(!confirm(`确认纯效导入“${file.name}”中的 ${count} 条卡效？\n只会按卡效 ID 更新中文效果描述和估值；其他字段保持不变。`))return;const result=await api('/api/effects/pure-import',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({backup})});current=null;effectUndo=null;effectDirty=false;effectHasSaveError=false;$('form').hidden=true;$('empty').hidden=false;await Promise.all([loadProfessions(),load()]);alert(`纯效导入完成：更新 ${result.updated} 条。`)}catch(e){alert('纯效导入失败，数据库未改变：'+e.message)}}

async function deleteCurrentEffect(){if(!current?.id||!(await flushEffectSave())||!confirm(`确认永久删除卡效 #${current.id}？\n该卡效会从所属卡牌和数据库中永久删除，无法通过撤销恢复。`))return;try{await api(`/api/effects/${current.id}?version=${current.version}`,{method:'DELETE'});current=null;effectUndo=null;effectDirty=false;effectHasSaveError=false;$('form').hidden=true;$('empty').hidden=false;await Promise.all([loadProfessions(),load()])}catch(error){alert('永久删除卡效失败：'+error.message)}}
const renderEffectFormWithDelete=renderForm;renderForm=()=>{renderEffectFormWithDelete();if(current?.id&&!current.isNew){const button=document.createElement('button');button.type='button';button.id='delete-effect';button.className='danger';button.textContent='永久删除卡效';button.onclick=deleteCurrentEffect;$('form').querySelector('.actions').append(button)}};

n,exportPureEffectsButton,importPureEffectsButton,importEffectsInput,importPureEffectsInput);$('search').parentElement.append(addEffectButton);$('search').onclick=load;$('sort').onchange=load;$('keyword').onkeydown=e=>{if(e.key==='Enter')load()};document.addEventListener('keydown',event=>{if(!['ArrowUp','ArrowDown'].includes(event.key)||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey||['INPUT','TEXTAREA','SELECT','BUTTON'].includes(event.target.tagName)||event.target.isContentEditable)return;event.preventDefault();navigateEffect(event.key==='ArrowUp'?-1:1)});Promise.all([api('/api/cards?language=zh&card_type=all&sort_by=title&direction=asc').then(p=>cards=p.items),loadProfessions(),load()]);
</script></body></html>
