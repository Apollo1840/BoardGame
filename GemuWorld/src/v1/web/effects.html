<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GemuWorld 卡效编辑</title><style>
:root{font-family:system-ui,sans-serif;color:#20242a;background:#edf0f3}*{box-sizing:border-box}body{margin:0}.top{height:60px;background:#17212b;color:#fff;padding:0 20px;display:flex;align-items:center;justify-content:space-between}.top a{color:#fff}.layout{display:grid;grid-template-columns:430px 1fr;height:calc(100vh - 60px)}aside{background:#fff;padding:14px;border-right:1px solid #ddd;overflow:auto}.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:10px}input,select,textarea,button{font:inherit;border:1px solid #c7cdd3;border-radius:7px;padding:8px}button{background:#1769aa;color:#fff;border:0;cursor:pointer}.profession-summary{display:flex;flex-wrap:wrap;align-items:center;gap:5px;padding:8px 0 10px;border-bottom:1px solid #e5e7eb}.profession-summary-label{font-size:12px;color:#69737c;margin-right:2px}.profession-filter-pill{cursor:pointer;border:2px solid transparent;user-select:none}.profession-filter-pill:hover{filter:brightness(.94)}.profession-filter-pill.active{border-color:#17212b;box-shadow:0 0 0 1px #fff inset}.effect-row{padding:9px;border-bottom:1px solid #eee;cursor:pointer}.effect-row:hover,.effect-row.active{background:#e8f2fb}.muted{font-size:12px;color:#69737c}.profession-pill{display:inline-block;padding:2px 7px;border-radius:999px;font-size:11px;font-weight:700;line-height:1.4;vertical-align:1px;background:#d1d5db;color:#374151}.profession-assassin{background:#fecaca;color:#991b1b}.profession-tank{background:#bfdbfe;color:#1e40af}.profession-marksman{background:#fed7aa;color:#9a3412}.profession-mage{background:#e9d5ff;color:#6b21a8}.profession-support{background:#bbf7d0;color:#166534}.dup{color:#a45b00;font-size:12px}main{padding:20px;overflow:auto}.panel{background:#fff;border-radius:12px;padding:18px;max-width:900px;margin:auto;box-shadow:0 2px 8px #0001}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:5px}.wide{grid-column:1/-1}textarea{min-height:130px}.profession-tags{display:flex;flex-wrap:wrap;gap:5px}.profession-tag{padding:3px 9px;border:1px solid #9ca3af;border-radius:999px;background:#d1d5db;color:#374151;font-size:12px}.profession-tag.profession-assassin{background:#fecaca;color:#991b1b;border-color:#f87171}.profession-tag.profession-tank{background:#bfdbfe;color:#1e40af;border-color:#60a5fa}.profession-tag.profession-marksman{background:#fed7aa;color:#9a3412;border-color:#fb923c}.profession-tag.profession-mage{background:#e9d5ff;color:#6b21a8;border-color:#c084fc}.profession-tag.profession-support{background:#bbf7d0;color:#166534;border-color:#4ade80}.profession-tag:hover{filter:brightness(.94)}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:15px}#target-search{min-width:180px}#target{min-width:220px}.status{padding:9px;border-radius:7px;margin-bottom:10px}.ok{background:#e4f5e9;color:#176b32}.error{background:#fde7e7;color:#9b1717}.empty{text-align:center;color:#777;padding:80px}@media(max-width:850px){.layout{grid-template-columns:1fr;height:auto}aside{max-height:350px}.grid{grid-template-columns:1fr}}
</style></head><body><header class="top"><strong>GemuWorld · 卡效编辑</strong><nav><a href="/viewer">Viewer</a> · <a href="/editor">卡牌编辑</a> · <a href="/design-guides">设计指南</a></nav></header><div class="layout"><aside><div class="filters"><select id="card-type"><option value="">全部卡型</option><option value="monster">怪物</option><option value="prophecy">预言</option></select><select id="effect-type"><option value="">全部效果</option><option value="monster_skill">怪物技能</option><option value="monster_attribute">通常属性</option><option value="monster_reactive_attribute">反应属性</option><option value="prophecy_effect">预言效果</option><option value="prophecy_reactive_effect">预言响应</option></select><select id="profession"><option value="">全部职业</option><option value="__unset__">未设置</option></select><select id="sort"><option value="id:asc">ID 从小到大</option><option value="id:desc">ID 从大到小</option><option value="text:asc">中文效果字典序</option><option value="text_length:asc">中文效果字数从少到多</option><option value="text_length:desc">中文效果字数从多到少</option><option value="owner:asc">卡名排序</option><option value="type:asc">效果类型排序</option><option value="profession:asc">职业排序</option><option value="valuation:desc">估值从高到低</option><option value="valuation:asc">估值从低到高</option></select><input id="keyword" class="wide" placeholder="搜索效果 ID、卡名或效果文字"><button id="search">查询</button></div><div id="profession-summary" class="profession-summary"></div><div id="list"></div></aside><main><div id="empty" class="empty">选择一条效果。</div><form id="form" class="panel" hidden></form></main></div><script>
const $=id=>document.getElementById(id);const FIXED_PROFESSIONS=['刺客','坦克','射手','法师','辅助'];let effects=[],current=null,cards=[],professions=[...FIXED_PROFESSIONS],professionCounts={},selectedProfessions=new Set(),navigating=false;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const effectLabels={monster_skill:'怪物技能',monster_attribute:'通常属性',monster_reactive_attribute:'反应属性',prophecy_effect:'预言效果',prophecy_reactive_effect:'预言响应'},professionClasses={'刺客':'profession-assassin','坦克':'profession-tank','射手':'profession-marksman','法师':'profession-mage','辅助':'profession-support'};const detailTitle=e=>e.type==='monster_skill'?`技能${e.translations.zh?.name?' - '+e.translations.zh.name:''}`:(effectLabels[e.type]||e.type);async function api(url,options){const r=await fetch(url,options),p=await r.json();if(!r.ok){const e=new Error(p.error||r.statusText);e.status=r.status;throw e}return p}
let editingProfessions=[];
function fieldLabel(label,onCard){return onCard?`<strong>${label}</strong>`:label}
function renderProfessionFilter(){const select=$('profession');select.innerHTML=`<option value="">全部职业</option>${professions.map(profession=>`<option value="${esc(profession)}">${esc(profession)}</option>`).join('')}<option value="__unset__">未设置</option>`;select.value=selectedProfessions.size===1?[...selectedProfessions][0]:''}
function renderProfessionSummary(){const summary=[...professions,'__unset__'];$('profession-summary').innerHTML=`<span class="profession-summary-label">职业词条：</span>${summary.map(profession=>`<span class="profession-pill profession-filter-pill ${professionClasses[profession]||''} ${selectedProfessions.has(profession)?'active':''}" data-profession="${esc(profession)}">${esc(profession==='__unset__'?'未设置':profession)} ${professionCounts[profession]||0}</span>`).join('')}`;document.querySelectorAll('.profession-filter-pill').forEach(pill=>pill.onclick=()=>toggleProfession(pill.dataset.profession))}
function toggleProfession(profession){selectedProfessions.has(profession)?selectedProfessions.delete(profession):selectedProfessions.add(profession);renderProfessionFilter();renderProfessionSummary();load()}
async function loadProfessions(){const payload=await api('/api/effect-professions'),stored=payload.items;professionCounts=payload.counts||{};professions=[...FIXED_PROFESSIONS,...stored.filter(profession=>!FIXED_PROFESSIONS.includes(profession))];const allowed=new Set([...professions,'__unset__']);selectedProfessions=new Set([...selectedProfessions].filter(profession=>allowed.has(profession)));renderProfessionFilter();renderProfessionSummary()}
async function load(){const q=new URLSearchParams(),[sort_by,direction]=$('sort').value.split(':');if($('card-type').value)q.set('card_type',$('card-type').value);if($('effect-type').value)q.set('effect_type',$('effect-type').value);selectedProfessions.forEach(profession=>q.append('profession',profession));if($('keyword').value)q.set('keyword',$('keyword').value);q.set('sort_by',sort_by);q.set('direction',direction);effects=(await api('/api/effects?'+q)).items;renderList()}
function renderList(){$('list').innerHTML=effects.map(e=>`<div class="effect-row ${current&&current.id===e.id?'active':''}" data-id="${e.id}">${(e.professions||[]).map(profession=>`<span class="profession-pill ${professionClasses[profession]||''}">${esc(profession)}</span> `).join('')}<strong>${esc(detailTitle(e))}</strong> <span class="muted">估值：${e.valuation??'未设置'}</span>${e.marker?` <span class="muted">${esc(e.marker)}</span>`:''}<div>${esc(e.translations.zh?.text||'')}</div>${e.duplicate_ids.length?`<div class="dup">相同文本效果 ID：${e.duplicate_ids.map(id=>'#'+id).join('、')}</div>`:''}</div>`).join('');document.querySelectorAll('.effect-row').forEach(r=>r.onclick=()=>openEffect(+r.dataset.id));$('list').querySelector('.effect-row.active')?.scrollIntoView({block:'nearest'})}
async function openEffect(id){current=await api('/api/effects/'+id);renderForm();renderList()}
function targetCards(keyword=''){const term=keyword.trim().toLocaleLowerCase();return cards.filter(c=>c.type===current.owner.card_type&&c.id!==current.owner.id&&(!term||`${c.title} ${c.card_id}`.toLocaleLowerCase().includes(term)))}
function renderTargets(keyword=''){const select=$('target'),selected=select.value,matching=targetCards(keyword);select.innerHTML=`<option value="">${matching.length?`复制到卡牌……（${matching.length}）`:'没有匹配卡牌'}</option>${matching.map(c=>`<option value="${c.type}:${c.id}">${esc(c.title)} · ${esc(c.card_id)}</option>`).join('')}`;if(Array.from(select.options).some(option=>option.value===selected))select.value=selected}
function renderEditingProfessions(){const box=$('editing-professions');box.innerHTML=editingProfessions.map((profession,index)=>`<button type="button" class="profession-tag ${professionClasses[profession]||''}" data-index="${index}" title="删除职业">${esc(profession)} ×</button>`).join('');box.querySelectorAll('button').forEach(button=>button.onclick=async()=>{editingProfessions.splice(+button.dataset.index,1);renderEditingProfessions();await persistCurrent()})}
function addEditingProfessions(text){let changed=false;for(const value of String(text||'').split(/[,，]/).map(value=>value.trim()).filter(Boolean)){if(!editingProfessions.includes(value)){editingProfessions.push(value);changed=true}}renderEditingProfessions();return changed}
function renderForm(){const zh=current.translations.zh||{},en=current.translations.en||{},skill=current.type==='monster_skill';editingProfessions=[...(current.professions||[])];$('empty').hidden=true;const f=$('form');f.hidden=false;f.innerHTML=`<div id="message"></div><h2>${esc(detailTitle(current))}</h2><p class="muted">所属卡牌：${esc(current.owner.title)} · ${esc(current.owner.card_id)} · effect #${current.id}</p><div class="grid"><label class="wide">效果类型<input value="${esc(effectLabels[current.type]||current.type)}" disabled></label><div class="wide" style="display:flex;gap:12px"><label style="width:140px">${fieldLabel('灵力消耗',skill)}<input name="energy" type="number" step="0.5" style="width:100%" value="${current.energy_cost??0}"></label><label style="width:140px">估值<input name="valuation" type="number" step="any" style="width:100%" value="${esc(current.valuation??'')}"></label></div><label>标记（最多10字）<input name="marker" maxlength="10" value="${esc(current.marker||'')}"></label><span></span><label class="wide">职业标签<span id="editing-professions" class="profession-tags"></span><input name="profession_input" placeholder="输入新职业，按回车或逗号添加"><span class="profession-tags">${professions.map(profession=>`<button type="button" class="profession-tag ${professionClasses[profession]||''}" data-profession="${esc(profession)}">${esc(profession)}</button>`).join('')}</span></label><label>${fieldLabel('中文名称',skill)}<input name="zh_name" value="${esc(zh.name)}"></label><label>${fieldLabel('英文名称',skill)}<input name="en_name" value="${esc(en.name)}"></label><label>${fieldLabel('中文效果',true)}<textarea name="zh_text">${esc(zh.text)}</textarea></label><label>${fieldLabel('英文效果',true)}<textarea name="en_text">${esc(en.text)}</textarea></label><label class="wide">备注<textarea name="notes">${esc(current.notes||'')}</textarea></label></div><div class="actions"><button type="submit">保存效果</button><input id="target-search" type="search" placeholder="搜索目标卡名或 card_id"><select id="target"></select><button type="button" id="copy">复制</button>${current.duplicate_ids.map(id=>`<button type="button" class="same-text" data-id="${id}">转到同文效果 #${id}</button>`).join('')}</div>`;f.onsubmit=save;renderEditingProfessions();renderTargets();f.profession_input.onkeydown=event=>{if(event.key==='Enter'||event.key===','||event.key==='，'){event.preventDefault();if(addEditingProfessions(event.target.value)){event.target.value='';persistCurrent()}}};$('target-search').oninput=event=>renderTargets(event.target.value);$('target-search').onkeydown=event=>{if(event.key==='Enter')event.preventDefault()};$('copy').onclick=copy;f.querySelectorAll('[data-profession]').forEach(button=>button.onclick=()=>{if(addEditingProfessions(button.dataset.profession))persistCurrent()});f.querySelectorAll('.same-text').forEach(button=>button.onclick=()=>openEffect(+button.dataset.id))}
async function persistCurrent(rerender=true){const f=$('form'),effect=current;addEditingProfessions(f.profession_input.value);f.profession_input.value='';let m=$('message');try{const saved=await api('/api/effects/'+effect.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({version:effect.version,type:effect.type,energy_cost:+f.energy.value||0,professions:editingProfessions,valuation:f.valuation.value===''?null:+f.valuation.value,marker:f.marker.value,notes:f.notes.value,translations:{zh:{name:f.zh_name.value,text:f.zh_text.value},en:{name:f.en_name.value,text:f.en_text.value}}})});await loadProfessions();if(rerender){current=saved;renderForm();m=$('message');m.className='status ok';m.textContent='效果保存成功'}return true}catch(e){m.className='status error';m.textContent=(e.status===409?'版本冲突：':'保存失败：')+e.message;return false}}
async function save(event){event.preventDefault();await persistCurrent()}
async function navigateEffect(step){if(navigating||!effects.length)return;const index=current?effects.findIndex(effect=>effect.id===current.id):-1,targetIndex=index<0?(step>0?0:effects.length-1):index+step;if(targetIndex<0||targetIndex>=effects.length)return;navigating=true;try{if(current&&!(await persistCurrent(false)))return;await openEffect(effects[targetIndex].id)}finally{navigating=false}}
async function copy(){const value=$('target').value;if(!value){alert('请选择目标卡牌');return}const [target_type,target_id]=value.split(':');try{const copied=await api(`/api/effects/${current.id}/copy`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({target_type,target_id:+target_id})});alert(`已复制为效果 #${copied.id}`);await load()}catch(e){alert('复制失败：'+e.message)}}
$('search').onclick=load;$('sort').onchange=load;$('profession').onchange=event=>{selectedProfessions=new Set(event.target.value?[event.target.value]:[]);renderProfessionSummary();load()};$('keyword').onkeydown=e=>{if(e.key==='Enter')load()};document.addEventListener('keydown',event=>{if(!['ArrowUp','ArrowDown'].includes(event.key)||event.altKey||event.ctrlKey||event.metaKey||event.shiftKey||['INPUT','TEXTAREA','SELECT','BUTTON'].includes(event.target.tagName)||event.target.isContentEditable)return;event.preventDefault();navigateEffect(event.key==='ArrowUp'?-1:1)});Promise.all([api('/api/cards?language=zh&card_type=all&sort_by=title&direction=asc').then(p=>cards=p.items),loadProfessions(),load()]);
</script></body></html>
