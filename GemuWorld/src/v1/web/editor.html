<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>GemuWorld 卡牌编辑器</title>
  <style>
    :root{font-family:system-ui,sans-serif;color:#20242a;background:#edf0f3}*{box-sizing:border-box}body{margin:0}.top{height:60px;background:#17212b;color:#fff;padding:0 20px;display:flex;align-items:center;justify-content:space-between}.top a{color:#fff}.layout{display:grid;grid-template-columns:320px 1fr;height:calc(100vh - 60px)}aside{background:#fff;border-right:1px solid #d9dde1;padding:14px;overflow:auto}.toolbar{display:flex;gap:7px;margin-bottom:10px}input,select,textarea,button{font:inherit;border:1px solid #c7cdd3;border-radius:7px;padding:8px}button{background:#1769aa;color:#fff;border:0;cursor:pointer}button.secondary{background:#586673}button.danger{background:#a82727}.cards{display:grid;gap:5px}.card-row{padding:9px;border-radius:7px;cursor:pointer;border:1px solid transparent}.card-row:hover,.card-row.active{background:#e8f2fb;border-color:#94bddc}.muted{font-size:12px;color:#69737c}main{padding:20px;overflow:auto}.panel{background:#fff;border-radius:12px;padding:18px;max-width:1000px;margin:0 auto 16px;box-shadow:0 2px 8px #0001}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}label{display:grid;gap:5px;font-size:13px}textarea{min-height:85px;resize:vertical}.wide{grid-column:1/-1}.effect{border:1px solid #dfe3e6;border-radius:9px;padding:12px;margin:10px 0;background:#fafbfc}.effect-head{display:flex;gap:8px;align-items:center;margin-bottom:10px}.effect-grid{display:grid;grid-template-columns:1fr 100px 1fr;gap:8px}.effect-grid textarea{grid-column:span 1}.actions{display:flex;gap:8px;flex-wrap:wrap}.status{padding:10px;border-radius:7px;margin-bottom:12px}.ok{background:#e4f5e9;color:#176b32}.error{background:#fde7e7;color:#9b1717}.deck-list{display:flex;gap:8px;flex-wrap:wrap}.deck-list label{display:flex;align-items:center;background:#f0f3f5;padding:7px 9px;border-radius:15px}.empty{text-align:center;color:#6e7880;padding:80px 20px}@media(max-width:800px){.layout{grid-template-columns:1fr;height:auto}aside{max-height:300px}.effect-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="top"><strong>GemuWorld · 卡牌编辑器</strong><nav><a href="/viewer">Viewer</a> · <a href="/decks">卡组管理</a> · <a href="/stats">统计</a> · <a href="/import">批量导入</a></nav></header>
  <div class="layout">
    <aside>
      <div class="toolbar"><select id="filter-type"><option value="monster">怪物</option><option value="prophecy">预言</option></select><button id="new">新建</button></div>
      <input id="search" style="width:100%;margin-bottom:10px" placeholder="搜索卡名">
      <div id="cards" class="cards"></div>
    </aside>
    <main><div id="empty" class="empty">选择一张卡牌，或点击“新建”。</div><form id="form" hidden></form></main>
  </div>
  <script>
    const $=id=>document.getElementById(id);let current=null,decks=[],cardList=[];
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function api(url,options){const response=await fetch(url,options);const payload=await response.json();if(!response.ok){const error=new Error(payload.error||response.statusText);error.status=response.status;throw error}return payload}
    async function loadDecks(){decks=(await api('/api/decks?language=zh')).items}
    async function loadList(){const type=$('filter-type').value;cardList=(await api(`/api/cards?language=zh&card_type=${type}&sort_by=title&direction=asc`)).items;renderList()}
    function renderList(){const needle=$('search').value.trim().toLowerCase();$('cards').innerHTML=cardList.filter(c=>!needle||c.title.toLowerCase().includes(needle)).map(c=>`<div class="card-row ${current&&current.type===c.type&&current.base.id===c.id?'active':''}" data-type="${c.type}" data-id="${c.id}"><strong>${esc(c.title)}</strong><div class="muted">${esc(c.card_id)}</div></div>`).join('');document.querySelectorAll('.card-row').forEach(row=>row.onclick=()=>openCard(row.dataset.type,+row.dataset.id))}
    async function openCard(type,id){try{current=await api(`/api/cards/${type}/${id}`);renderForm();renderList()}catch(error){alert(error.message)}}
    function emptyCard(type){return{type,base:{card_id:'',version:0,level:0,monster_type:'',attack:0,defence:0,magic:0,image_path:''},translations:{zh:{title:'',monster_type:'',description:'',introduction:''},en:{title:'',monster_type:'',description:'',introduction:''}},effects:[],decks:[],isNew:true}}
    function effectOptions(type,selected){const options=type==='monster'?[['monster_skill','怪物技能'],['monster_attribute','通常属性'],['monster_reactive_attribute','反应属性']]:[['prophecy_effect','预言效果'],['prophecy_reactive_effect','预言响应效果']];return options.map(([value,label])=>`<option value="${value}" ${value===selected?'selected':''}>${label}</option>`).join('')}
    function effectHtml(effect,index){const zh=effect.translations?.zh||{},en=effect.translations?.en||{};return `<div class="effect" data-id="${effect.id||''}" data-version="${effect.version||0}"><div class="effect-head"><select class="effect-type">${effectOptions(current.type,effect.type)}</select><label>消耗<input class="energy" type="number" step="0.5" value="${esc(effect.energy_cost??0)}"></label><label>职业标签<input class="profession" value="${esc((effect.professions||[]).join(', '))}" placeholder="逗号分隔，例如：刺客、辅助"></label><label>估值<input class="valuation" type="number" step="any" value="${esc(effect.valuation??'')}"></label><label>标记<input class="marker" maxlength="10" value="${esc(effect.marker||'')}"></label><button type="button" class="danger remove-effect">删除效果</button></div><div class="effect-grid"><input class="zh-name" placeholder="中文名称" value="${esc(zh.name)}"><span></span><input class="en-name" placeholder="English name" value="${esc(en.name)}"><textarea class="zh-text" placeholder="中文效果">${esc(zh.text)}</textarea><span></span><textarea class="en-text" placeholder="English effect">${esc(en.text)}</textarea><textarea class="notes" placeholder="设计备注">${esc(effect.notes||'')}</textarea><span></span><span></span></div></div>`}
    function renderForm(){
      $('empty').hidden=true;const form=$('form');form.hidden=false;const b=current.base,zh=current.translations.zh||{},en=current.translations.en||{};const monster=current.type==='monster';
      form.innerHTML=`<div id="message"></div><section class="panel"><h2>${current.isNew?'新建':'编辑'}${monster?'怪物卡':'预言卡'}</h2><div class="grid"><label>稳定 card_id<input name="card_id" value="${esc(b.card_id)}" ${current.isNew?'':'disabled'}></label><label>图片路径<input name="image" value="${esc(b.image_path)}"></label>${monster?`<label>等级<input name="level" type="number" min="0" value="${esc(b.level)}"></label><label>中文属性<input name="monster_type" value="${esc(b.monster_type)}"></label><label>攻击<input name="attack" type="number" step="0.5" value="${esc(b.attack)}"></label><label>防御<input name="defence" type="number" step="0.5" value="${esc(b.defence)}"></label><label>魔力<input name="magic" type="number" step="0.5" value="${esc(b.magic)}"></label>`:''}<label>中文卡名<input name="zh_title" required value="${esc(zh.title)}"></label><label>英文卡名<input name="en_title" value="${esc(en.title)}"></label>${monster?`<label>英文属性<input name="en_monster_type" value="${esc(en.monster_type)}"></label><label class="wide">中文描述<textarea name="zh_description">${esc(zh.description)}</textarea></label><label class="wide">英文描述<textarea name="en_description">${esc(en.description)}</textarea></label>`:`<label class="wide">中文介绍<textarea name="zh_introduction">${esc(zh.introduction)}</textarea></label><label class="wide">英文介绍<textarea name="en_introduction">${esc(en.introduction)}</textarea></label>`}</div></section><section class="panel"><h2>独占效果</h2><div id="effects">${current.effects.map(effectHtml).join('')}</div><button type="button" id="add-effect">添加效果</button></section><section class="panel"><h2>所属卡组</h2><div class="deck-list">${decks.map(deck=>`<label><input type="checkbox" name="deck" value="${esc(deck.code)}" ${current.decks.some(value=>value.code===deck.code)?'checked':''}>${esc(deck.name)}</label>`).join('')}</div></section><section class="panel actions"><button type="submit">保存</button>${current.isNew?'':`<button type="button" class="secondary" id="copy">复制卡牌</button><button type="button" class="secondary" id="archive">归档</button><button type="button" class="danger" id="permanent">永久删除</button>`}</section>`;
      form.onsubmit=save;form.querySelectorAll('.remove-effect').forEach(button=>button.onclick=()=>button.closest('.effect').remove());$('add-effect').onclick=()=>{const div=document.createElement('div');div.innerHTML=effectHtml({type:monster?'monster_skill':'prophecy_effect',energy_cost:0,translations:{}},document.querySelectorAll('.effect').length);const effect=div.firstElementChild;$('effects').append(effect);effect.querySelector('.remove-effect').onclick=()=>effect.remove()};if(!current.isNew){$('copy').onclick=copyCurrent;$('archive').onclick=()=>remove(false);$('permanent').onclick=()=>remove(true)}
    }
    function collect(){const form=$('form'),monster=current.type==='monster';const effects=Array.from(document.querySelectorAll('.effect')).map((row,index)=>({id:row.dataset.id?+row.dataset.id:undefined,version:+row.dataset.version||0,type:row.querySelector('.effect-type').value,position:index,energy_cost:+row.querySelector('.energy').value||0,professions:[...new Set(row.querySelector('.profession').value.split(/[,，]/).map(value=>value.trim()).filter(Boolean))],valuation:row.querySelector('.valuation').value===''?null:+row.querySelector('.valuation').value,marker:row.querySelector('.marker').value,notes:row.querySelector('.notes').value,translations:{zh:{name:row.querySelector('.zh-name').value,text:row.querySelector('.zh-text').value},en:{name:row.querySelector('.en-name').value,text:row.querySelector('.en-text').value}}}));const base={card_id:form.card_id.value,image:form.image.value};if(monster)Object.assign(base,{level:+form.level.value||0,monster_type:form.monster_type.value,attack:+form.attack.value||0,defence:+form.defence.value||0,magic:+form.magic.value||0});return{version:current.base.version,base,translations:{zh:{title:form.zh_title.value,...(monster?{monster_type:form.monster_type.value,description:form.zh_description.value}:{introduction:form.zh_introduction.value})},en:{title:form.en_title.value,...(monster?{monster_type:form.en_monster_type.value,description:form.en_description.value}:{introduction:form.en_introduction.value})}},effects,deck_codes:Array.from(form.querySelectorAll('[name=deck]:checked')).map(x=>x.value)}}
    async function save(event){event.preventDefault();let message=$('message');message.className='status';message.textContent='保存中……';try{const url=current.isNew?`/api/cards/${current.type}`:`/api/cards/${current.type}/${current.base.id}`;const saved=await api(url,{method:current.isNew?'POST':'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(collect())});current=saved;await loadList();renderForm();message=$('message');message.className='status ok';message.textContent='保存成功。Viewer、统计和导出已同步。'}catch(error){message.className='status error';message.textContent=(error.status===409?'版本冲突，请重新打开卡牌：':'保存失败：')+error.message}}
    async function remove(permanent){const action=permanent?'永久删除':'归档';if(!confirm(`确认${action}这张卡？`))return;try{await api(`/api/cards/${current.type}/${current.base.id}?version=${current.base.version}&permanent=${permanent}`,{method:'DELETE'});current=null;$('form').hidden=true;$('empty').hidden=false;await loadList()}catch(error){alert(action+'失败：'+error.message)}}
    async function copyCurrent(){if(!confirm('复制当前卡牌及其效果和卡组关系？'))return;try{current=await api(`/api/cards/${current.type}/${current.base.id}/copy`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});await loadList();renderForm()}catch(error){alert('复制失败：'+error.message)}}
    $('filter-type').onchange=loadList;$('search').oninput=renderList;$('new').onclick=()=>{current=emptyCard($('filter-type').value);renderForm();renderList()};Promise.all([loadDecks(),loadList()]);
  </script>
</body>
</html>
