<body>
  <header class="top"><strong>GemuWorld · 卡牌编辑器</strong><nav><a href="/viewer">Viewer</a> · <a href="/decks">卡组管理</a> · <a href="/stats">统计</a> · <a href="/import">批量导入</a></nav></header>
  <div class="layout">

  <script>
    const $=id=>document.getElementById(id),effectEditor=window.GemuEffectEditor,FIXED_PROFESSIONS=effectEditor.fixedProfessions;let current=null,decks=[],cardList=[],professions=[...FIXED_PROFESSIONS],monsterTypes=[],cardDirty=false,cardEditRevision=0,cardUndo=null,cardSaveChain=Promise.resolve(),cardHasSaveError=false;
    const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    async function api(url,options){const response=await fetch(url,options);const payload=await response.json();if(!response.ok){const error=new Error(payload.error||response.statusText);error.status=response.status;throw error}return payload}
    async function loadDecks(){decks=(await api('/api/decks?language=zh')).items}

    async function loadMonsterTypes(){monsterTypes=(await api('/api/monster-types')).items}
    function monsterTypeOptions(selected){const values=['',...monsterTypes.map(item=>item.zh)];if(selected&&!values.includes(selected))values.push(selected);return values.map(value=>`<option value="${esc(value)}" ${value===selected?'selected':''}>${esc(value||'未设置')}</option>`).join('')}

    function effectIndicators(card,type,style,label){return card.effects.filter(effect=>effect.type===type).map((_,index)=>indicator(style,`${label} ${index+1}`)).join('')}
    function cardEffectiveMagic(card){return effectEstimateValues(card.effects||[]).effectiveMagic}
    function prophecyKind(introduction){const match=String(introduction||'').trim().match(/^【([^】]+)】/);return match?match[1]:''}
    function hasMonsterDescription(description){return String(description||'').replace(/^\s*【[^】]*种】\s*/,'').trim().length>0}
    function cardListHtml(card){const active=current&&current.type===card.type&&current.base.id===card.id?'active':'';if(card.type==='monster'){const indicators=(hasMonsterDescription(card.description)?indicator('description','有种族标志以外的描述'):'')+effectIndicators(card,'monster_attribute','attribute','通常属性')+effectIndicators(card,'monster_reactive_attribute','reactive','反应属性')+effectIndicators(card,'monster_skill','skill','技能'),effectiveMagic=cardEffectiveMagic(card),magic=effectiveMagic!==0?`<span class="magic-pill" title="实效魔力">${esc(formatEstimate(effectiveMagic))}</span>`:'',stars='★'.repeat(Math.max(0,Math.floor(Number(card.level)||0)));return `<div class="card-row ${active}" data-type="${card.type}" data-id="${card.id}"><div class="card-title-line">${magic}<strong>${esc(card.title)}</strong>${stars?`<span class="level-stars" title="Lv${esc(card.level)}">${stars}</span>`:''}<span class="card-stats">(${esc(card.attack)}/${esc(card.defence)})</span><div class="indicator-row">${indicators}</div></div></div>`}const kind=prophecyKind(card.introduction),indicators=effectIndicators(card,'prophecy_effect','prophecy','预言效果')+effectIndicators(card,'prophecy_reactive_effect','prophecy-reactive','预言响应效果');return `<div class="card-row ${active}" data-type="${card.type}" data-id="${card.id}"><div class="card-title-line"><strong>${esc(card.title)}</strong>${kind?`<span class="card-special">${esc(kind)}</span>`:''}<div class="indicator-row">${indicators}</div></div></div>`}
    function setSelectOptions(id,options,reset=false){const select=$(id),old=reset?'':select.value;select.innerHTML=options.map(([value,label])=>`<option value="${esc(value)}">${esc(label)}</option>`).join('');if(options.some(([value])=>value===old))select.value=old}
    function updateListControls(reset=false){const monster=$('filter-type').value==='monster';if(monster){const levels=[...new Set(cardList.map(card=>String(card.level)))].sort((a,b)=>Number(a)-Number(b));setSelectOptions('filter-value',[['','全部等级'],...levels.map(level=>[level,`Lv${level}`])],reset);setSelectOptions('filter-content',[['','全部内容'],['description','有描述'],['monster_attribute','有通常属性'],['monster_reactive_attribute','有反应属性'],['monster_skill','有技能']],reset);setSelectOptions('sort',[['title:asc','卡名正序'],['title:desc','卡名倒序'],['level:asc','等级从低到高'],['level:desc','等级从高到低'],['attack:desc','攻击从高到低'],['magic:desc','魔力从高到低'],['effective_magic:desc','实效魔力从高到低'],['effective_magic:asc','实效魔力从低到高'],['defence:desc','防御从高到低'],['monster_skill:desc','技能从多到少'],['updated_at:desc','最近更新']],reset)}else{const kinds=[...new Set(cardList.map(card=>prophecyKind(card.introduction)).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'zh-CN'));setSelectOptions('filter-value',[['','全部特殊种类'],['__none__','未设置'],...kinds.map(kind=>[kind,kind])],reset);setSelectOptions('filter-content',[['','全部内容'],['introduction','有介绍'],['prophecy_effect','有预言效果'],['prophecy_reactive_effect','有响应效果']],reset);setSelectOptions('sort',[['title:asc','卡名正序'],['title:desc','卡名倒序'],['kind:asc','特殊种类正序'],['prophecy_effect:desc','效果从多到少'],['prophecy_reactive_effect:desc','响应从多到少'],['updated_at:desc','最近更新']],reset)}}
    function effectCount(card,type){return card.effects.filter(effect=>effect.type===type).length}
    function filteredCards(){const monster=$('filter-type').value==='monster',value=$('filter-value').value,content=$('filter-content').value,needle=$('search').value.trim().toLocaleLowerCase(),[sortKey,direction]=$('sort').value.split(':');let cards=cardList.filter(card=>{if(needle&&!card.title.toLocaleLowerCase().includes(needle))return false;if(value){if(monster&&String(card.level)!==value)return false;const kind=prophecyKind(card.introduction);if(!monster&&(value==='__none__'?Boolean(kind):kind!==value))return false}if(!content)return true;if(content==='description')return hasMonsterDescription(card.description);if(content==='introduction')return Boolean(card.introduction?.trim());return effectCount(card,content)>0});const numericKeys=new Set(['level','attack','magic','defence']);cards.sort((a,b)=>{let left,right;if(sortKey==='title'){left=a.title;right=b.title}else if(sortKey==='kind'){left=prophecyKind(a.introduction);right=prophecyKind(b.introduction)}else if(sortKey==='updated_at'){left=a.updated_at;right=b.updated_at}else if(sortKey==='effective_magic'){left=cardEffectiveMagic(a);right=cardEffectiveMagic(b)}else if(numericKeys.has(sortKey)){left=Number(a[sortKey]);right=Number(b[sortKey])}else{left=effectCount(a,sortKey);right=effectCount(b,sortKey)}const comparison=typeof left==='string'?left.localeCompare(right,'zh-CN'):left-right;return direction==='desc'?-comparison:comparison});return cards}
    function renderList(){$('cards').innerHTML=filteredCards().map(cardListHtml).join('');document.querySelectorAll('.card-row').forEach(row=>row.onclick=()=>openCard(row.dataset.type,+row.dataset.id))}
    async function openCard(type,id){try{if(current&&!(await flushCardSave())&&!current.isNew)return;current=await api(`/api/cards/${type}/${id}`);cardDirty=false;cardUndo=null;cardHasSaveError=false;renderForm();renderList()}catch(error){alert(error.message)}}
    function emptyCard(type){return{type,base:{card_id:'',version:0,level:0,monster_type:'',attack:0,defence:0,magic:0},translations:{zh:{title:'',monster_type:'',description:'',introduction:''},en:{title:'',monster_type:'',description:'',introduction:''}},effects:[],decks:[],isNew:true}}
    const effectLabels=effectEditor.effectLabels,professionClasses=effectEditor.professionClasses;
    function effectOptions(type,selected){const options=type==='monster'?[['monster_skill','怪物技能'],['monster_attribute','通常属性'],['monster_reactive_attribute','反应属性']]:[['prophecy_effect','预言效果'],['prophecy_reactive_effect','预言响应效果']];return options.map(([value,label])=>`<option value="${value}" ${value===selected?'selected':''}>${label}</option>`).join('')}
    const monsterEffectLimits={monster_attribute:1,monster_reactive_attribute:1,monster_skill:3};
    function effectTypeCount(type){return Array.from(document.querySelectorAll('.effect-type')).filter(select=>select.value===type).length}
    function canAddEffectType(type){return current?.type!=='monster'||effectTypeCount(type)<monsterEffectLimits[type]}
    function nextEffectType(){if(current.type==='prophecy')return'prophecy_effect';return['monster_skill','monster_attribute','monster_reactive_attribute'].find(canAddEffectType)||''}
    function effectCapacityReason(type){const labels={monster_attribute:'通常属性',monster_reactive_attribute:'反应属性',monster_skill:'技能'},limit=monsterEffectLimits[type];return limit?`怪物卡最多只能有${limit}个${labels[type]}`:''}
    function updateAddEffectButton(){const button=$('add-effect');if(!button)return;const available=current.type!=='monster'||Boolean(nextEffectType());button.disabled=!available;button.textContent=available?'添加效果':'添加效果（已达上限）';button.style.opacity=available?'1':'.65';button.style.cursor=available?'pointer':'not-allowed';if($('effect-library-select'))renderEffectLibrary()}
    function effectDetailTitle(type,name=''){return effectEditor.detailTitle(type,name)}
    function effectHtml(effect,index){const zh=effect.translations?.zh||{},en=effect.translations?.en||{},skill=effectEditor.supportsEnergy(effect.type);return `<div class="effect" data-id="${effect.id||''}" data-version="${effect.version||0}"><div class="effect-head"><h3 class="effect-title">${esc(effectDetailTitle(effect.type,zh.name))}</h3><button type="button" class="danger remove-effect">删除</button></div><div class="effect-detail-grid"><label class="wide">效果类型<select class="effect-type">${effectOptions(current.type,effect.type)}</select></label><div class="effect-numbers wide">${skill?`<label><span class="energy-label effect-field-on-card">灵力消耗</span><input class="energy" type="number" step="0.5" value="${esc(effect.energy_cost??0)}"></label>`:''}<label>估值<input class="valuation" type="number" step="any" value="${esc(effect.valuation??'')}"></label></div>${skill?`<label><span class="name-label effect-field-on-card">中文名称</span><input class="zh-name" value="${esc(zh.name)}"></label><label><span class="name-label effect-field-on-card">英文名称</span><input class="en-name" value="${esc(en.name)}"></label>`:'<input class="zh-name" type="hidden" value=""><input class="en-name" type="hidden" value="">'}<label><span class="effect-field-on-card">中文效果</span><textarea class="zh-text">${esc(zh.text)}</textarea></label><label><span class="effect-field-on-card">英文效果</span><textarea class="en-text">${esc(en.text)}</textarea></label><div class="wide" style="border-top:1px solid #d9dee3;margin:6px 0 2px"></div><label class="wide">职业标签<span class="profession-tags selected-professions">${(effect.professions||[]).map(value=>`<button type="button" class="profession-tag ${professionClasses[value]||''}" data-selected-profession="${esc(value)}" title="删除职业">${esc(value)} ×</button>`).join('')}</span><input class="profession-input" placeholder="输入新职业，按回车或逗号添加"><span class="profession-tags preset-professions">${professions.map(value=>`<button type="button" class="profession-tag ${professionClasses[value]||''}" data-profession="${esc(value)}">${esc(value)}</button>`).join('')}</span></label><label>标记（最多10字）<input class="marker" maxlength="10" value="${esc(effect.marker||'')}"></label><span></span><label class="wide">备注<textarea class="notes">${esc(effect.notes||'')}</textarea></label></div></div>`}
    const linkedEffectHtml=effectHtml;effectHtml=(...args)=>linkedEffectHtml(...args).replace('>删除</button>','>解除链接</button>');
    function rowProfessions(row){return Array.from(row.querySelectorAll('[data-selected-profession]')).map(button=>button.dataset.selectedProfession)}
    function renderRowProfessions(row,values){const box=row.querySelector('.selected-professions');box.innerHTML=values.map(value=>`<button type="button" class="profession-tag ${professionClasses[value]||''}" data-selected-profession="${esc(value)}" title="删除职业">${esc(value)} ×</button>`).join('');box.querySelectorAll('[data-selected-profession]').forEach(button=>button.onclick=()=>{renderRowProfessions(row,values.filter(value=>value!==button.dataset.selectedProfession));markCardDirty();requestCardSave()});updateCardEffectSummary()}
    function addRowProfessions(row,text){const values=rowProfessions(row);for(const value of String(text||'').split(/[,，]/).map(value=>value.trim()).filter(Boolean))if(!values.includes(value))values.push(value);renderRowProfessions(row,values)}
    function effectFromRow(row){const professionInput=row.querySelector('.profession-input');addRowProfessions(row,professionInput.value);professionInput.value='';const type=row.querySelector('.effect-type').value,energy=row.querySelector('.energy'),zhName=row.querySelector('.zh-name'),enName=row.querySelector('.en-name');return{id:row.dataset.id?+row.dataset.id:undefined,version:+row.dataset.version||0,type,energy_cost:effectEditor.supportsEnergy(type)?(+energy?.value||0):null,professions:rowProfessions(row),valuation:row.querySelector('.valuation').value===''?null:+row.querySelector('.valuation').value,marker:row.querySelector('.marker').value,notes:row.querySelector('.notes').value,translations:{zh:{name:effectEditor.supportsName(type)?(zhName?.value||''):'',text:row.querySelector('.zh-text').value},en:{name:effectEditor.supportsName(type)?(enName?.value||''):'',text:row.querySelector('.en-text').value}}}}
    function effectEstimateValues(effects){const valued=effects.map(effect=>({...effect,numericValuation:effect.valuation==null||effect.valuation===''?null:Number(effect.valuation)})).filter(effect=>Number.isFinite(effect.numericValuation)),attributeValuation=valued.filter(effect=>effect.type==='monster_attribute'||effect.type==='monster_reactive_attribute').reduce((sum,effect)=>sum+effect.numericValuation,0),skillValues=valued.filter(effect=>effect.type==='monster_skill').map(effect=>effect.numericValuation-(Number(effect.energy_cost)||0)),skillValuation=skillValues.length?Math.max(...skillValues):0;return{skillValuation,effectiveMagic:attributeValuation+skillValuation}}
    function effectProfessionGroups(effects){const primary=new Set(),secondary=new Set();effects.forEach(effect=>{let target=null;if(effect.type==='monster_attribute'||effect.type==='monster_skill'&&(Number(effect.energy_cost)||0)<=0)target=primary;else if(effect.type==='monster_reactive_attribute'||effect.type==='monster_skill'&&(Number(effect.energy_cost)||0)>0)target=secondary;if(target)(effect.professions||[]).forEach(profession=>target.add(profession))});return{primary:[...primary],secondary:[...secondary]}}
    function formatEstimate(value){return String(Math.round((Number(value)||0)*100)/100)}
    function updateCardEffectSummary(){const effectiveMagic=$('effective-magic-estimate'),skillValuation=$('skill-valuation-estimate'),primary=$('primary-professions'),secondary=$('secondary-professions');if(!effectiveMagic&&!skillValuation&&!primary&&!secondary)return;const effects=Array.from(document.querySelectorAll('.effect')).map(row=>({type:row.querySelector('.effect-type').value,energy_cost:row.querySelector('.energy')?.value||0,valuation:row.querySelector('.valuation').value,professions:rowProfessions(row)})),values=effectEstimateValues(effects),groups=effectProfessionGroups(effects);if(effectiveMagic)effectiveMagic.value=formatEstimate(values.effectiveMagic);if(skillValuation)skillValuation.value=formatEstimate(values.skillValuation);if(primary)primary.value=groups.primary.join('、')||'—';if(secondary)secondary.value=groups.secondary.join('、')||'—'}

    function renderForm(){
      $('empty').hidden=true;const form=$('form');form.hidden=false;const b=current.base,zh=current.translations.zh||{},en=current.translations.en||{};const monster=current.type==='monster';
      form.innerHTML=`<div id="message"></div><section class="panel"><h2>${current.isNew?'新建':'编辑'}${monster?'怪物卡':'预言卡'}</h2><div class="grid"><label>稳定 card_id<input name="card_id" value="${esc(b.card_id)}" ${current.isNew?'':'disabled'}></label>${monster?`<label>等级<input name="level" type="number" min="0" value="${esc(b.level)}"></label><label>中文属性<select name="monster_type">${monsterTypeOptions(b.monster_type)}</select></label><label>攻击<input name="attack" type="number" step="0.5" value="${esc(b.attack)}"></label><label>防御<input name="defence" type="number" step="0.5" value="${esc(b.defence)}"></label><label>魔力<input name="magic" type="number" step="0.5" value="${esc(b.magic)}"></label><label title="通常属性估值 + 反应属性估值 + 技力估值">实效魔力<input id="effective-magic-estimate" class="computed-field" readonly></label>`:''}<label>中文卡名<input name="zh_title" required value="${esc(zh.title)}"></label><label>英文卡名<input name="en_title" value="${esc(en.title)}"></label>${monster?`<label class="wide">中文描述<textarea name="zh_description">${esc(zh.description)}</textarea></label><label class="wide">英文描述<textarea name="en_description">${esc(en.description)}</textarea></label>`:`<label class="wide">中文介绍<textarea name="zh_introduction">${esc(zh.introduction)}</textarea></label><label class="wide">英文介绍<textarea name="en_introduction">${esc(en.introduction)}</textarea></label>`}</div><p class="muted">英文属性将依据中文属性自动翻译；图片路径已锁定为 pics/${esc(b.card_id||'<card_id>')}.png</p></section><section class="panel"><h2>属性与技能</h2>${monster?`<div class="grid" style="margin-bottom:12px"><label title="max(技能估值 - 技能灵力消耗)">技力估值<input id="skill-valuation-estimate" class="computed-field" readonly></label><label title="通常属性职业，以及不需要灵力消耗的技能职业集合">主职业<input id="primary-professions" class="computed-field" readonly></label><label title="反应属性职业，以及需要灵力消耗的技能职业集合">副职业<input id="secondary-professions" class="computed-field" readonly></label></div>`:''}<div id="effects">${current.effects.map(effectHtml).join('')}</div><button type="button" id="add-effect">添加效果</button></section><section class="panel"><h2>所属卡组</h2><div class="deck-list">${decks.map(deck=>`<label><input type="checkbox" name="deck" value="${esc(deck.code)}" ${current.decks.some(value=>value.code===deck.code)?'checked':''}>${esc(deck.name)}</label>`).join('')}</div></section><section class="panel actions"><button type="button" class="secondary" id="undo-card">撤销上次更改</button>${current.isNew?'':`<button type="button" class="secondary" id="copy">复制卡牌</button><button type="button" class="secondary" id="archive">归档</button><button type="button" class="danger" id="permanent">永久删除</button>`}</section>`;
      form.onsubmit=event=>event.preventDefault();form.querySelectorAll('.effect').forEach(bindEffectRow);$('undo-card').onclick=undoCard;updateCardUndoButton();updateAddEffectButton();updateCardEffectSummary();form.addEventListener('input',event=>{if(!event.target.closest('#effect-library')){updateCardEffectSummary();markCardDirty()}});form.addEventListener('focusout',event=>{if(!event.target.closest('#effect-library')&&event.target.matches('input,textarea,select'))requestCardSave()});form.addEventListener('change',event=>{if(!event.target.closest('#effect-library')){updateCardEffectSummary();markCardDirty();requestCardSave()}});$('add-effect').onclick=()=>{const type=nextEffectType();if(!type)return;const div=document.createElement('div');div.innerHTML=effectHtml({type,energy_cost:0,professions:[],valuation:null,marker:'',notes:'',translations:{}},document.querySelectorAll('.effect').length);const effect=div.firstElementChild;$('effects').append(effect);bindEffectRow(effect);updateAddEffectButton();updateCardEffectSummary();markCardDirty();requestCardSave(true)};if(!current.isNew){$('copy').onclick=copyCurrent;$('archive').onclick=()=>remove(false);$('permanent').onclick=()=>remove(true)}
    }
    function collect(){const form=$('form'),monster=current.type==='monster';const effects=Array.from(document.querySelectorAll('.effect')).map((row,index)=>({...effectFromRow(row),position:index}));const base={card_id:form.card_id.value};if(monster)Object.assign(base,{level:+form.level.value||0,monster_type:form.monster_type.value,attack:+form.attack.value||0,defence:+form.defence.value||0,magic:+form.magic.value||0});return{version:current.base.version,base,translations:{zh:{title:form.zh_title.value,...(monster?{monster_type:form.monster_type.value,description:form.zh_description.value}:{introduction:form.zh_introduction.value})},en:{title:form.en_title.value,...(monster?{description:form.en_description.value}:{introduction:form.en_introduction.value})}},effects,deck_codes:Array.from(form.querySelectorAll('[name=deck]:checked')).map(x=>x.value)}}
    const clone=value=>JSON.parse(JSON.stringify(value));
    function cardPayload(card){return{version:card.base.version,base:clone(card.base),translations:clone(card.translations),effects:clone(card.effects),deck_codes:(card.decks||[]).map(deck=>deck.code)}}
    function updateCardUndoButton(){const button=$('undo-card');if(!button)return;button.disabled=!cardUndo;button.style.opacity=cardUndo?'1':'.65';button.style.background=cardUndo?'#5d6873':'#c7cdd3';button.style.cursor=cardUndo?'pointer':'not-allowed'}
    function markCardDirty(){if(!current)return;cardDirty=true;cardEditRevision++}
    function effectSignature(effect){return JSON.stringify({type:effect.type,energy_cost:effect.energy_cost,professions:effect.professions||[],valuation:effect.valuation,marker:effect.marker||'',notes:effect.notes||'',translations:effect.translations||{}})}
    function syncCardVersions(saved,payload,submittedRows){const versions=new Map(saved.effects.map(effect=>[effect.id,effect.version])),unused=[...saved.effects];submittedRows.forEach((row,index)=>{if(!row.isConnected)return;if(row.dataset.id){const version=versions.get(+row.dataset.id);if(version!=null)row.dataset.version=version;return}const signature=effectSignature(payload.effects[index]),matchIndex=unused.findIndex(effect=>effectSignature(effect)===signature);if(matchIndex<0)return;const match=unused.splice(matchIndex,1)[0];row.dataset.id=match.id;row.dataset.version=match.version})}
    async function persistCard(rerender=false){if(!current||!cardDirty)return true;const form=$('form');if(current.isNew&&!form.zh_title.value.trim()){const message=$('message');message.className='status';message.textContent='填写中文卡名后将自动保存。';return false}const revision=cardEditRevision,wasNew=current.isNew,previous=wasNew?null:cardPayload(current),submittedRows=Array.from(document.querySelectorAll('.effect')),payload=collect(),message=$('message');if(!cardHasSaveError){message.className='status';message.textContent='自动保存中……'}try{const url=wasNew?`/api/cards/${current.type}`:`/api/cards/${current.type}/${current.base.id}`,saved=await api(url,{method:wasNew?'POST':'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});current=saved;cardDirty=cardEditRevision!==revision;cardUndo=previous;if(cardUndo)for(const detached of saved.detached_effects||[]){const effect=cardUndo.effects.find(value=>value.id===detached.id);if(effect)effect.version=detached.version}cardHasSaveError=false;await loadList();if((wasNew||rerender)&&!cardDirty)renderForm();else{syncCardVersions(saved,payload,submittedRows);updateCardUndoButton();const status=$('message');status.className='status ok';status.textContent=cardDirty?'已保存上一项更改，正在等待保存新输入。':'已自动保存。'}return true}catch(error){cardHasSaveError=true;message.className='status error';message.textContent=(error.status===409?'版本冲突，请重新打开卡牌：':'自动保存失败：')+error.message;return false}}
    function requestCardSave(rerender=false){cardSaveChain=cardSaveChain.then(()=>persistCard(rerender),()=>persistCard(rerender));return cardSaveChain}
    async function flushCardSave(){let saved=await cardSaveChain;while(saved!==false&&cardDirty)saved=await requestCardSave();return !cardDirty}
    async function undoCard(){if(!cardUndo||!current||current.isNew)return;await flushCardSave();if(!cardUndo)return;const payload=clone(cardUndo),currentVersions=new Map(current.effects.map(effect=>[effect.id,effect.version]));payload.version=current.base.version;payload.effects=payload.effects.map(effect=>{const copy=clone(effect),version=currentVersions.get(copy.id);if(version!=null)copy.version=version;else if(copy.id==null){delete copy.id;delete copy.version}return copy});const message=$('message');message.className='status';message.textContent='正在撤销……';try{current=await api(`/api/cards/${current.type}/${current.base.id}`,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});cardUndo=null;cardDirty=false;await loadList();renderForm();const status=$('message');status.className='status ok';status.textContent='已撤销最近一次自动保存。'}catch(error){message.className='status error';message.textContent='撤销失败：'+error.message}}
    async function remove(permanent){const action=permanent?'永久删除':'归档';if(!(await flushCardSave())||!confirm(`确认${action}这张卡？`))return;try{await api(`/api/cards/${current.type}/${current.base.id}?version=${current.base.version}&permanent=${permanent}`,{method:'DELETE'});current=null;cardUndo=null;cardDirty=false;$('form').hidden=true;$('empty').hidden=false;await loadList()}catch(error){alert(action+'失败：'+error.message)}}
    async function copyCurrent(){if(!(await flushCardSave())||!confirm('复制当前卡牌及其效果和卡组关系？'))return;try{current=await api(`/api/cards/${current.type}/${current.base.id}/copy`,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});cardUndo=null;cardDirty=false;await loadList();renderForm()}catch(error){alert('复制失败：'+error.message)}}
    let libraryEffects=[];
    let effectLibraryTimer;
    function installEffectLibrary(){if(!current||!$('effects')||$('effect-library'))return;const box=document.createElement('div');box.id='effect-library';box.style.cssText='margin-top:14px;padding-top:14px;border-top:1px solid #dfe3e6';box.innerHTML=`<strong>从卡效库添加</strong><div class="toolbar" style="margin-top:8px"><input id="effect-library-search" style="flex:1" placeholder="搜索未链接卡效的类型、ID、名称或效果文本"><button type="button" id="effect-library-search-button" class="secondary">搜索</button></div><div class="toolbar"><select id="effect-library-select" style="flex:1"><option value="">正在读取未链接卡效……</option></select><button type="button" id="add-library-effect">添加</button></div>`;$('add-effect').insertAdjacentElement('afterend',box);const input=$('effect-library-search');$('effect-library-search-button').onclick=searchEffectLibrary;input.oninput=()=>{clearTimeout(effectLibraryTimer);effectLibraryTimer=setTimeout(searchEffectLibrary,220)};input.onkeydown=event=>{if(event.key==='Enter'){event.preventDefault();searchEffectLibrary()}};$('add-library-effect').onclick=()=>{const id=+$('effect-library-select').value;if(id)addLibraryEffect(id);else alert('请先选择一个未链接卡效。')};searchEffectLibrary()}
    async function searchEffectLibrary(){const q=new URLSearchParams({unassigned:'true',available_for:current.type,sort_by:'id',direction:'asc'}),keyword=$('effect-library-search').value.trim();if(keyword)q.set('keyword',keyword);try{libraryEffects=(await api('/api/effects?'+q)).items;renderEffectLibrary()}catch(error){alert('搜索卡效库失败：'+error.message)}}
    function renderEffectLibrary(){const select=$('effect-library-select');if(!select)return;const linked=new Set(Array.from(document.querySelectorAll('.effect[data-id]')).map(row=>+row.dataset.id).filter(Boolean)),items=libraryEffects.filter(effect=>!linked.has(effect.id)&&canAddEffectType(effect.type));select.innerHTML=`<option value="">${items.length?'请选择未链接卡效':'没有匹配且可添加的未链接卡效'}</option>`+items.map(effect=>{const zh=effect.translations?.zh||{},title=effectEditor.detailTitle(effect.type,zh.name),summary=effectEditor.compactText(zh.text,36);return `<option value="${effect.id}">${esc(title)}${summary?' · '+esc(summary):''}</option>`}).join('')}
    function addLibraryEffect(id){const effect=libraryEffects.find(value=>value.id===id);if(!effect)return;if(!canAddEffectType(effect.type)){alert(effectCapacityReason(effect.type));return}const div=document.createElement('div');div.innerHTML=effectHtml(effect,document.querySelectorAll('.effect').length);const row=div.firstElementChild;$('effects').append(row);bindEffectRow(row);updateAddEffectButton();updateCardEffectSummary();renderEffectLibrary();markCardDirty();requestCardSave(true)}
    new MutationObserver(installEffectLibrary).observe($('form'),{childList:true,subtree:false});
    $('filter-type').onchange=async()=>{if(current)await flushCardSave();loadList(true)};$('query').onclick=renderList;$('search').onkeydown=event=>{if(event.key==='Enter')renderList()};$('new').onclick=async()=>{if(current&&!(await flushCardSave())&&!current.isNew)return;current=emptyCard($('filter-type').value);cardDirty=false;cardUndo=null;cardHasSaveError=false;renderForm();renderList()};Promise.all([loadDecks(),loadProfessions(),loadMonsterTypes(),loadList(true)]);
  </script>
