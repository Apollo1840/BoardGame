    let libraryEffects=[];
    let effectLibraryTimer;
    function installEffectLibrary(){if(!current||!$('effects')||$('effect-library'))return;const box=document.createElement('div');box.id='effect-library';box.style.cssText='margin-top:14px;padding-top:14px;border-top:1px solid #dfe3e6';box.innerHTML=`<strong>从卡效库添加</strong><div class="toolbar" style="margin-top:8px"><input id="effect-library-search" style="flex:1" placeholder="搜索未链接卡效的类型、ID、名称或效果文本"><button type="button" id="effect-library-search-button" class="secondary">搜索</button></div><div class="toolbar"><select id="effect-library-select" style="flex:1"><option value="">正在读取未链接卡效……</option></select><button type="button" id="add-library-effect">添加</button></div>`;$('add-effect').insertAdjacentElement('afterend',box);const input=$('effect-library-search');$('effect-library-search-button').onclick=searchEffectLibrary;input.oninput=()=>{clearTimeout(effectLibraryTimer);effectLibraryTimer=setTimeout(searchEffectLibrary,220)};input.onkeydown=event=>{if(event.key==='Enter'){event.preventDefault();searchEffectLibrary()}};$('add-library-effect').onclick=()=>{const id=+$('effect-library-select').value;if(id)addLibraryEffect(id);else alert('请先选择一个未链接卡效。')};searchEffectLibrary()}
    async function searchEffectLibrary(){const q=new URLSearchParams({unassigned:'true',available_for:current.type,sort_by:'id',direction:'asc'}),keyword=$('effect-library-search').value.trim();if(keyword)q.set('keyword',keyword);try{libraryEffects=(await api('/api/effects?'+q)).items;renderEffectLibrary()}catch(error){alert('搜索卡效库失败：'+error.message)}}
    function renderEffectLibrary(){const select=$('effect-library-select');if(!select)return;const linked=new Set(Array.from(document.querySelectorAll('.effect[data-id]')).map(row=>+row.dataset.id).filter(Boolean)),items=libraryEffects.filter(effect=>!linked.has(effect.id)&&canAddEffectType(effect.type));select.innerHTML=`<option value="">${items.length?'请选择未链接卡效':'没有匹配且可添加的未链接卡效'}</option>`+items.map(effect=>{const zh=effect.translations?.zh||{},title=effectEditor.detailTitle(effect.type,zh.name),professionText=(effect.professions||[]).join('、')||'未设置职业',summary=effectEditor.compactText(zh.text,36)||'无简述';return `<option value="${effect.id}">${esc(title)} - ${esc(professionText)} - ${esc(summary)}</option>`}).join('')}
    function addLibraryEffect(id){const effect=libraryEffects.find(value=>value.id===id);if(!effect)return;if(!canAddEffectType(effect.type)){alert(effectCapacityReason(effect.type));return}const div=document.createElement('div');div.innerHTML=effectHtml(effect,document.querySelectorAll('.effect').length);const row=div.firstElementChild;$('effects').append(row);bindEffectRow(row);updateAddEffectButton();updateCardEffectSummary();renderEffectLibrary();markCardDirty();requestCardSave(true)}
    new MutationObserver(installEffectLibrary).observe($('form'),{childList:true,subtree:false});
    $('filter-type').onchange=async()=>{if(current)await flushCardSave();loadList(true)};$('filter-deck').onchange=renderList;$('filter-primary-profession').onchange=renderList;$('sort').onchange=renderList;$('query').onclick=renderList;$('search').onkeydown=event=>{if(event.key==='Enter')renderList()};$('new').onclick=async()=>{const type=$('filter-type').value;if(type==='all'){alert('请先选择怪物或预言，再添加卡牌。');return}if(current&&!(await flushCardSave())&&!current.isNew)return;current=emptyCard(type);cardDirty=false;cardUndo=null;cardHasSaveError=false;renderForm();renderList()};async function initializeEditor(){await Promise.all([loadDecks(),loadProfessions(),loadMonsterTypes(),loadMonsterDesignRows(),loadList(true)]);if(['monster','prophecy'].includes(initialCardType)&&Number.isInteger(initialCardId)&&initialCardId>0)await openCard(initialCardType,initialCardId)}initializeEditor();
  </script>
</body>
