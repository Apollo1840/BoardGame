<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GemuWorld 设计指南</title><style>
:root{font-family:system-ui,sans-serif;color:#20242a;background:#edf0f3}*{box-sizing:border-box}body{margin:0}.top{height:60px;background:#17212b;color:#fff;padding:0 20px;display:flex;align-items:center;justify-content:space-between}.top a{color:#fff}main{max-width:1200px;margin:auto;padding:20px}.tabs{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}button,input,textarea{font:inherit;border:1px solid #c7cdd3;border-radius:7px;padding:8px}button{background:#1769aa;color:#fff;border:0;cursor:pointer}.panel{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 8px #0001;margin-bottom:14px}.guide-list{display:grid;grid-template-columns:260px 1fr;gap:16px}.guide-row{padding:9px;cursor:pointer;border-radius:7px}.guide-row:hover,.guide-row.active{background:#e8f2fb}label{display:grid;gap:5px;margin-bottom:10px}textarea{min-height:480px;resize:vertical}.status{padding:9px}.ok{color:#176b32}.error{color:#a21c1c}.table-scroll{overflow:auto;max-height:calc(100vh - 230px);border:1px solid #dfe3e6;border-radius:8px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #e4e7e9;padding:6px}td input{width:80px}.monster-design-table{min-width:820px}.monster-design-table th{position:sticky;top:0;z-index:1;background:#eaf0f5;text-align:center;white-space:nowrap}.monster-design-table td{text-align:center;white-space:nowrap}.monster-design-table tbody tr:nth-child(even){background:#f8fafb}.monster-design-table tbody tr:hover{background:#eaf4fb}.monster-design-table td:first-child{font-weight:700}.section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:12px}.section-head h2{margin:0 0 4px}.muted{font-size:12px;color:#69737c}@media(max-width:800px){.guide-list{grid-template-columns:1fr}textarea{min-height:300px}.section-head{align-items:start;flex-direction:column}}
</style></head><body><header class="top"><strong>GemuWorld · 设计指南</strong><nav><a href="/viewer">Viewer</a> · <a href="/effects">效果统览</a> · <a href="/editor">卡牌编辑</a></nav></header><main><div class="tabs"><button id="show-guides">指南文档</button><button id="show-monster-design">怪物数值设计</button><button id="show-benchmarks">怪物数值基准</button></div><section id="guides" class="panel guide-list"><div id="guide-list"></div><form id="guide-form"><div class="muted">选择一篇指南</div></form></section><section id="monster-design" class="panel" hidden><div class="section-head"><div><h2>怪物数值设计</h2><div id="monster-design-source" class="muted"></div></div><div id="monster-design-count" class="muted"></div></div><div id="monster-design-table" class="table-scroll"></div></section><section id="benchmarks" class="panel" hidden><h2>怪物数值设计参考</h2><div style="overflow:auto"><table><thead><tr><th>等级</th><th>总数值</th><th>攻击上限</th><th>防御上限</th><th>效果品阶</th><th>1增</th><th>2增</th><th>多增</th><th></th></tr></thead><tbody id="benchmark-body"></tbody></table></div></section></main><script>
const $=id=>document.getElementById(id);let guides=[],current=null,benchmarks=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,options){const r=await fetch(url,options),p=await r.json();if(!r.ok){const e=new Error(p.error||r.statusText);e.status=r.status;throw e}return p}
async function loadGuides(){guides=(await api('/api/design-guides')).items;const generalGuides=guides.filter(g=>g.code!=='monster_design_table');$('guide-list').innerHTML=generalGuides.map(g=>`<div class="guide-row ${current&&current.id===g.id?'active':''}" data-id="${g.id}"><strong>${esc(g.title)}</strong><div class="muted">${esc(g.source_path)} · v${g.version}</div></div>`).join('');document.querySelectorAll('.guide-row').forEach(r=>r.onclick=()=>{current=guides.find(g=>g.id===+r.dataset.id);renderGuide();loadGuides()});renderMonsterDesign()}
function markdownTable(content){const lines=String(content||'').split(/\r?\n/);for(let index=0;index<lines.length-1;index++){const header=tableCells(lines[index]),separator=tableCells(lines[index+1]);if(header.length>1&&separator.length===header.length&&separator.every(cell=>/^:?-{3,}:?$/.test(cell))){const rows=[];for(let rowIndex=index+2;rowIndex<lines.length;rowIndex++){const cells=tableCells(lines[rowIndex]);if(cells.length!==header.length)break;rows.push(cells)}return{header,rows}}}return null}
function tableCells(line){const text=String(line||'').trim();if(!text.includes('|'))return[];return text.replace(/^\|/,'').replace(/\|$/,'').split('|').map(cell=>cell.trim())}
function renderMonsterDesign(){const guide=guides.find(value=>value.code==='monster_design_table'),target=$('monster-design-table');if(!guide){$('monster-design-source').textContent='未找到 monster_design_table 指南';$('monster-design-count').textContent='';target.innerHTML='<div class="status error">无法加载怪物数值设计表。</div>';return}const parsed=markdownTable(guide.content);$('monster-design-source').textContent=`${guide.source_path} · v${guide.version}`;if(!parsed){$('monster-design-count').textContent='';target.innerHTML='<div class="status error">指南中没有可渲染的 Markdown 表格。</div>';return}$('monster-design-count').textContent=`${parsed.rows.length} 条设计基准`;target.innerHTML=`<table class="monster-design-table"><thead><tr>${parsed.header.map(cell=>`<th>${esc(cell)}</th>`).join('')}</tr></thead><tbody>${parsed.rows.map(row=>`<tr>${row.map(cell=>`<td>${esc(cell)}</td>`).join('')}</tr>`).join('')}</tbody></table>`}
function renderGuide(){const f=$('guide-form');f.innerHTML=`<div id="message"></div><label>标题<input name="title" value="${esc(current.title)}"></label><label>Markdown 内容<textarea name="content">${esc(current.content)}</textarea></label><button>保存指南</button>`;f.onsubmit=saveGuide}
async function saveGuide(e){e.preventDefault();let m=$('message');try{current=await api('/api/design-guides/'+current.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({version:current.version,title:e.target.title.value,content:e.target.content.value})});await loadGuides();renderGuide();m=$('message');m.className='status ok';m.textContent='保存成功'}catch(x){m.className='status error';m.textContent=(x.status===409?'版本冲突：':'保存失败：')+x.message}}
async function loadBenchmarks(){benchmarks=(await api('/api/monster-benchmarks')).items;$('benchmark-body').innerHTML=benchmarks.map(b=>`<tr data-id="${b.id}">${['level','total_stats','attack_max','defence_max','effect_tier','one_bonus','two_bonus','multi_bonus'].map(k=>`<td><input data-key="${k}" type="number" step="0.5" value="${b[k]??''}"></td>`).join('')}<td><button class="save-benchmark">保存</button></td></tr>`).join('');document.querySelectorAll('.save-benchmark').forEach(btn=>btn.onclick=()=>saveBenchmark(btn.closest('tr')))}
async function saveBenchmark(row){const original=benchmarks.find(b=>b.id===+row.dataset.id),payload={version:original.version};row.querySelectorAll('input').forEach(i=>payload[i.dataset.key]=i.value===''?null:+i.value);try{const updated=await api('/api/monster-benchmarks/'+original.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});Object.assign(original,updated);alert('数值基准已保存')}catch(e){alert((e.status===409?'版本冲突：':'保存失败：')+e.message)}}
function showSection(id){['guides','monster-design','benchmarks'].forEach(section=>$(section).hidden=section!==id)}
$('show-guides').onclick=()=>showSection('guides');$('show-monster-design').onclick=()=>showSection('monster-design');$('show-benchmarks').onclick=()=>{showSection('benchmarks');loadBenchmarks()};loadGuides();
</script></body></html>
