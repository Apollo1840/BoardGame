<!doctype html><html lang="zh"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GemuWorld 设计指南</title><style>
:root{font-family:system-ui,sans-serif;color:#20242a;background:#edf0f3}*{box-sizing:border-box}body{margin:0}.top{height:60px;background:#17212b;color:#fff;padding:0 20px;display:flex;align-items:center;justify-content:space-between}.top a{color:#fff}main{max-width:1200px;margin:auto;padding:20px}.tabs{display:flex;gap:8px;margin-bottom:14px}button,input,textarea{font:inherit;border:1px solid #c7cdd3;border-radius:7px;padding:8px}button{background:#1769aa;color:#fff;border:0;cursor:pointer}.panel{background:#fff;border-radius:12px;padding:18px;box-shadow:0 2px 8px #0001;margin-bottom:14px}.guide-list{display:grid;grid-template-columns:260px 1fr;gap:16px}.guide-row{padding:9px;cursor:pointer;border-radius:7px}.guide-row:hover,.guide-row.active{background:#e8f2fb}label{display:grid;gap:5px;margin-bottom:10px}textarea{min-height:480px;resize:vertical}.status{padding:9px}.ok{color:#176b32}.error{color:#a21c1c}table{width:100%;border-collapse:collapse;font-size:13px}th,td{border-bottom:1px solid #e4e7e9;padding:6px}td input{width:80px}.muted{font-size:12px;color:#69737c}@media(max-width:800px){.guide-list{grid-template-columns:1fr}textarea{min-height:300px}}
</style></head><body><header class="top"><strong>GemuWorld · 设计指南</strong><nav><a href="/viewer">Viewer</a> · <a href="/effects">效果统览</a> · <a href="/editor">卡牌编辑</a></nav></header><main><div class="tabs"><button id="show-guides">指南文档</button><button id="show-benchmarks">怪物数值基准</button></div><section id="guides" class="panel guide-list"><div id="guide-list"></div><form id="guide-form"><div class="muted">选择一篇指南</div></form></section><section id="benchmarks" class="panel" hidden><h2>怪物数值设计参考</h2><div style="overflow:auto"><table><thead><tr><th>等级</th><th>总数值</th><th>攻击上限</th><th>防御上限</th><th>效果品阶</th><th>1增</th><th>2增</th><th>多增</th><th></th></tr></thead><tbody id="benchmark-body"></tbody></table></div></section></main><script>
const $=id=>document.getElementById(id);let guides=[],current=null,benchmarks=[];const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));async function api(url,options){const r=await fetch(url,options),p=await r.json();if(!r.ok){const e=new Error(p.error||r.statusText);e.status=r.status;throw e}return p}
async function loadGuides(){guides=(await api('/api/design-guides')).items;$('guide-list').innerHTML=guides.map(g=>`<div class="guide-row ${current&&current.id===g.id?'active':''}" data-id="${g.id}"><strong>${esc(g.title)}</strong><div class="muted">${esc(g.source_path)} · v${g.version}</div></div>`).join('');document.querySelectorAll('.guide-row').forEach(r=>r.onclick=()=>{current=guides.find(g=>g.id===+r.dataset.id);renderGuide();loadGuides()})}
function renderGuide(){const f=$('guide-form');f.innerHTML=`<div id="message"></div><label>标题<input name="title" value="${esc(current.title)}"></label><label>Markdown 内容<textarea name="content">${esc(current.content)}</textarea></label><button>保存指南</button>`;f.onsubmit=saveGuide}
async function saveGuide(e){e.preventDefault();let m=$('message');try{current=await api('/api/design-guides/'+current.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({version:current.version,title:e.target.title.value,content:e.target.content.value})});await loadGuides();renderGuide();m=$('message');m.className='status ok';m.textContent='保存成功'}catch(x){m.className='status error';m.textContent=(x.status===409?'版本冲突：':'保存失败：')+x.message}}
async function loadBenchmarks(){benchmarks=(await api('/api/monster-benchmarks')).items;$('benchmark-body').innerHTML=benchmarks.map(b=>`<tr data-id="${b.id}">${['level','total_stats','attack_max','defence_max','effect_tier','one_bonus','two_bonus','multi_bonus'].map(k=>`<td><input data-key="${k}" type="number" step="0.5" value="${b[k]??''}"></td>`).join('')}<td><button class="save-benchmark">保存</button></td></tr>`).join('');document.querySelectorAll('.save-benchmark').forEach(btn=>btn.onclick=()=>saveBenchmark(btn.closest('tr')))}
async function saveBenchmark(row){const original=benchmarks.find(b=>b.id===+row.dataset.id),payload={version:original.version};row.querySelectorAll('input').forEach(i=>payload[i.dataset.key]=i.value===''?null:+i.value);try{const updated=await api('/api/monster-benchmarks/'+original.id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});Object.assign(original,updated);alert('数值基准已保存')}catch(e){alert((e.status===409?'版本冲突：':'保存失败：')+e.message)}}
$('show-guides').onclick=()=>{$('guides').hidden=false;$('benchmarks').hidden=true};$('show-benchmarks').onclick=()=>{$('guides').hidden=true;$('benchmarks').hidden=false;loadBenchmarks()};loadGuides();
</script></body></html>
